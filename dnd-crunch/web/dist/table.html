<style>
/* ---- css/00-tokens.css ---- */
/* The table's tokens: the war table's palette from ui/table-mockup.html. Survey paper by
   day, a lamp-lit slate by night, a pigment a realm, brass (--accent) for Morten and the
   tower; --good, --warn, --bad only for states. Every colour is defined on bare :root
   (light), then redefined for dark under prefers-color-scheme (unless the viewer chose
   light) and under [data-theme="dark"] (the page's own switch). Fonts: Alegreya SC for
   headings, Alegreya Sans for text, IBM Plex Mono for numbers and dice.
   Layout: phone first at 412 px, one view at a time over a bottom bar; from 900 px two
   zones, the Story on the left and a drawer on the right. */
:root {
  --bg: #e1e6e4; --panel: #eef1ef; --panel-2: #d5dcd9; --table: #c7d0cd;
  --ink: #18232a; --ink-2: #44525a; --ink-3: #66737a; --rule: #b3bdbc; --track: #c4ccca;
  --land: #ebe9df; --water: #4f86ad; --halo: #eef1ef;
  --accent: #8a5a10; --on-accent: #fff8ea; --accent-soft: #efe3c6;
  --good: #2b6d43; --warn: #8f6200; --bad: #ad3528; --world: #e4e2ee; --world-rule: #8c84b8;
  --f-humans: #2c5eb3; --f-gnomes: #0d7f7e; --f-tieflings: #ad2d69; --f-orcs: #557719;
  --f-goblinkind: #bd600c; --f-elves: #7145b3; --f-tower: #33384f; --f-other: #66737a;
  --on-fc: #ffffff; --mix: 30%;
  --display: "Alegreya SC", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171a; --panel: #1a2125; --panel-2: #232c31; --table: #0c1012;
    --ink: #e2e8e6; --ink-2: #a9b4b6; --ink-3: #7e8a8d; --rule: #34404a; --track: #2e3a41;
    --land: #283035; --water: #5b93bb; --halo: #12171a;
    --accent: #e0a94e; --on-accent: #1c1406; --accent-soft: #3a2e14;
    --good: #6cc28a; --warn: #e3b54f; --bad: #f07a6a; --world: #201e2c; --world-rule: #8c84b8;
    --f-humans: #6f9df0; --f-gnomes: #3cc0bb; --f-tieflings: #ea6aa2; --f-orcs: #9bc44c;
    --f-goblinkind: #f0954a; --f-elves: #ad8ae8; --f-tower: #c3c8de; --f-other: #8a9599;
    --on-fc: #0f1417; --mix: 34%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171a; --panel: #1a2125; --panel-2: #232c31; --table: #0c1012;
  --ink: #e2e8e6; --ink-2: #a9b4b6; --ink-3: #7e8a8d; --rule: #34404a; --track: #2e3a41;
  --land: #283035; --water: #5b93bb; --halo: #12171a;
  --accent: #e0a94e; --on-accent: #1c1406; --accent-soft: #3a2e14;
  --good: #6cc28a; --warn: #e3b54f; --bad: #f07a6a; --world: #201e2c; --world-rule: #8c84b8;
  --f-humans: #6f9df0; --f-gnomes: #3cc0bb; --f-tieflings: #ea6aa2; --f-orcs: #9bc44c;
  --f-goblinkind: #f0954a; --f-elves: #ad8ae8; --f-tower: #c3c8de; --f-other: #8a9599;
  --on-fc: #0f1417; --mix: 34%;
  color-scheme: dark;
}
:root {
  --r-card: 10px; --r-ctl: 8px; --tap: 44px;
  --now-h: 64px;          /* set by the app from the now line's real height */
}
/* ---- css/10-shell.css ---- */
/* The shell: base, the now line and HUD, the views, the bottom bar and the drawer, and
   the shared atoms every panel may use (cards, chips, bars, buttons, notes, dice, trace
   lines, the answer box's parts). Most rules are the mockup's (ui/table-mockup.html);
   panel-only rules belong in the panel's own CSS file. */

/* ---------- base ---------- */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button { font: inherit; color: inherit; cursor: pointer; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4, h5 { font-family: var(--display); font-weight: 500; margin: 0; line-height: 1.15; text-wrap: balance; }
p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
ul, ol { padding: 0; list-style: none; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.muted { color: var(--ink-3); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.15em; flex: none; }
.fac-humans { --fc: var(--f-humans); } .fac-gnomes { --fc: var(--f-gnomes); } .fac-tieflings { --fc: var(--f-tieflings); }
.fac-orcs { --fc: var(--f-orcs); } .fac-goblinkind { --fc: var(--f-goblinkind); } .fac-elves { --fc: var(--f-elves); }
.fac-tower { --fc: var(--f-tower); } .fac-none { --fc: var(--land); }
.sw { display: inline-block; flex: none; width: 11px; height: 11px; border-radius: 3px; background: var(--fc); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--ink) 25%, transparent); vertical-align: -1px; }
.who { color: var(--fc); font-weight: 700; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); } .brass { color: var(--accent); }


/* ---------- the now line and the HUD ---------- */
.now { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--rule); }
.now-in { max-width: 1280px; margin: 0 auto; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 4px; }
.now .where { display: flex; align-items: baseline; gap: 2px 8px; flex-wrap: wrap; font-family: var(--mono); font-size: .76rem; color: var(--ink-2); min-width: 0; }
.now .where b { color: var(--ink); font-weight: 600; }
.now .where .place { min-width: 0; overflow-wrap: anywhere; }
.now .doing { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--accent); min-width: 0; }
.now .doing .ago { color: var(--ink-3); }
.now .doing.yours { color: var(--good); }
.now .doing.ended { color: var(--ink-3); }
.pulse { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 50%, transparent); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--accent) 50%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
.hud { display: flex; align-items: center; gap: 2px 10px; flex-wrap: wrap; font-family: var(--mono); font-size: .76rem; color: var(--ink-2); }
.hud:empty { display: none; }
.hud > span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.hud b { color: var(--ink); font-weight: 600; }
.hud .spent { color: var(--ink-3); text-decoration: line-through; }
.hud .lit { color: var(--accent); }
.bar { display: inline-block; vertical-align: middle; height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; flex: 1 1 auto; min-width: 36px; }
.bar > i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
.bar.mid > i { background: var(--warn); } .bar.low > i { background: var(--bad); }
.hud .bar { width: 64px; flex: none; }

/* ---------- the views, the bottom bar and the drawer ---------- */
.app { max-width: 1280px; margin: 0 auto; padding-top: 14px; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; align-content: start; }
.pane, .drawer { display: grid; gap: 14px; align-content: start; min-width: 0; }
.drawer:empty { display: none; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: var(--panel); border-top: 1px solid var(--rule); padding: 2px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.tabs button { position: relative; flex: 1 1 0; min-width: 0; min-height: 58px; border: 0; background: none; padding: 6px 0 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 500 .7rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.tabs .ic { width: 22px; height: 22px; stroke-width: 1.6; }
.tabs button[aria-current="true"] { color: var(--accent); }
.tabs .dot { position: absolute; top: 8px; left: calc(50% + 10px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; }
.subtabs button { min-height: var(--tap); padding: 0 14px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); font: 500 .78rem var(--mono); color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.subtabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.subtabs .theme { position: relative; margin-left: auto; width: var(--tap); padding: 0; justify-content: center; border-radius: 50%; }
.subtabs .theme span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.subtabs .theme .ic { width: 18px; height: 18px; }
.dtabs { display: none; }
#more-tabs { gap: 5px; }
#more-tabs button:not(.theme) { padding: 0 10px; }

/* phone: one view at a time */
@media (max-width: 899.98px) {
  .pane { display: none; }
  .app[data-view="story"] #story, .app[data-view="morten"] #morten, .app[data-view="realm"] #realm, .app[data-view="fights"] #fights,
  .app[data-view="more"][data-more="months"] #months, .app[data-view="more"][data-more="rules"] #rules,
  .app[data-view="more"][data-more="talk"] #talk, .app[data-view="more"][data-more="table"] #table { display: grid; }
  #more-tabs { display: none; }
  .app[data-view="more"] #more-tabs { display: flex; }
  .now .doing { margin-left: 0; flex-basis: 100%; }
}

/* wide: the Story on the left, the drawer on the right */
@media (min-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 28px; align-items: start; padding-top: 20px; padding-bottom: 40px; }
  .app > .notice { grid-column: 1 / -1; }
  #story { grid-column: 1; }
  .drawer { grid-column: 2; position: sticky; top: calc(var(--now-h) + 12px); max-height: calc(100vh - var(--now-h) - 24px); max-height: calc(100dvh - var(--now-h) - 24px); overflow-y: auto; overscroll-behavior: contain; padding: 2px 4px 12px 2px; }
  .drawer .pane { display: none; }
  .app[data-drawer="morten"] #morten, .app[data-drawer="realm"] #realm, .app[data-drawer="fights"] #fights, .app[data-drawer="months"] #months,
  .app[data-drawer="rules"] #rules, .app[data-drawer="talk"] #talk, .app[data-drawer="table"] #table { display: grid; }
  .dtabs { display: flex; position: sticky; top: 0; z-index: 2; background: var(--bg); padding-bottom: 6px; gap: 4px; }
  .dtabs button { padding: 0 12px; }
  .dtabs button:not(.theme) .ic { display: none; }
  #more-tabs, .tabs { display: none; }
}

/* ---------- notices: the store's state, and first-visit notes ---------- */
.notice { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--panel); font-size: .92rem; color: var(--ink-2); }
.notice .ic { color: var(--ink-3); margin-top: 3px; width: 18px; height: 18px; }
.notice b { color: var(--ink); font-weight: 600; }
.notice.err { border-color: var(--bad); }
.notice.err .ic { color: var(--bad); }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border: 1px dashed var(--accent); border-radius: 8px; background: var(--accent-soft); font-size: .92rem; }
.note .ic { color: var(--accent); margin-top: 3px; }
.note button { border: 0; background: none; color: var(--accent); font-family: var(--mono); font-size: .72rem; min-height: var(--tap); min-width: var(--tap); padding: 0 4px; }
.stub { color: var(--ink-3); font: 500 .8rem var(--mono); padding: 8px 0; }
.panel-error { border: 1px dashed var(--bad); border-radius: var(--r-ctl); padding: 10px 12px; color: var(--bad); font: .8rem var(--mono); }

/* ---------- shared atoms: sections, story text, foes, HP rows, the trace ---------- */
.sec { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.sec-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }
.sec-head .ic { width: 22px; height: 22px; color: var(--accent); margin-top: 3px; }
.sec-head h3 { font-size: 1.25rem; }
.sec-head h3 small { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); font-weight: 500; letter-spacing: 0; margin-left: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--mono); font-size: .74rem; color: var(--ink-2); }
.out { font-weight: 600; }
.story p { font-size: 1.02rem; line-height: 1.6; }
.story .head { font-weight: 500; }
.bullets { display: grid; gap: 6px; }
.bullets li { position: relative; padding-left: 14px; line-height: 1.5; font-size: .98rem; }
.bullets li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); transform: rotate(45deg); }
.bullets b { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
.foes { display: grid; gap: 4px; }
.foe { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; font-size: .9rem; padding: 6px 10px; border-radius: 6px; background: var(--bg); }
.foe b { font-weight: 700; }
.foe .stats { grid-column: 1 / -1; font-family: var(--mono); font-size: .72rem; color: var(--ink-2); }
.foe .hp { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: .74rem; white-space: nowrap; }
.foe .hp .bar { width: 54px; flex: none; }
.hprow { display: grid; gap: 6px; }
.hprow .hp { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) auto; align-items: center; gap: 8px; font-family: var(--mono); font-size: .76rem; }
.hprow .hp .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.trace { border-top: 1px solid var(--rule); padding-top: 6px; }
details.trace > summary { list-style: none; cursor: pointer; min-height: var(--tap); display: flex; align-items: center; gap: 8px; font: 500 .74rem var(--mono); color: var(--accent); }
details.trace > summary::-webkit-details-marker { display: none; }
details.trace > summary .ic { transition: transform .2s; }
details.trace[open] > summary .ic { transform: rotate(90deg); }
.round { display: grid; gap: 3px; padding: 4px 0; }
.round h5 { margin: 0; font: 500 .68rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); display: flex; gap: 8px; align-items: center; }
.round h5::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.ln { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; font-family: var(--mono); font-size: .76rem; line-height: 1.55; }
.ln .mk { text-align: center; color: var(--accent); }
.ln.them .mk { color: var(--ink-3); }
.ln.them { padding-left: 12px; }
.ln .tx { overflow-wrap: anywhere; }
.die { display: inline-flex; align-items: center; gap: 4px; margin: 1px 2px 1px 0; padding: 0 6px; border-radius: 4px; border: 1px solid var(--rule); background: var(--bg); font-size: .7rem; white-space: nowrap; }
.die b { font-weight: 600; } .die i { font-style: normal; color: var(--ink-3); }
.die .r { font-weight: 600; } .die .r.hit, .die .r.ok { color: var(--good); } .die .r.miss { color: var(--ink-3); } .die .r.fizz, .die .r.fail { color: var(--bad); }
.die.nat20 { border-color: var(--accent); background: var(--accent-soft); } .die.nat1 { border-color: var(--bad); }
.die u { text-decoration: none; color: var(--ink-3); }
.die s { color: var(--ink-3); }
.die.fizzle { border-color: var(--bad); border-style: dashed; }
.die .r.nat { color: var(--accent); }
.die.nat1 .r.nat { color: var(--bad); }
.dice { display: inline; }
.result { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--mono); font-size: .74rem; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 8px; }
.result b { color: var(--ink); font-weight: 600; }
.you { justify-self: end; max-width: 88%; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 14px 14px 4px 14px; padding: 8px 14px; display: grid; gap: 2px; }
.you .label { font-size: .62rem; }
.you p { line-height: 1.5; }
.sec.aside { background: transparent; border: 0; border-left: 2px dashed var(--accent); border-radius: 0; padding: 4px 0 4px 14px; }
.sec.aside .sec-head .ic { color: var(--accent); }
.sec.aside p { color: var(--ink-2); font-size: .95rem; line-height: 1.5; }
.sec.plain { background: transparent; border: 0; padding: 2px 0; }
.sec.plain .sec-head h3 { font-size: 1.05rem; }
.sec.plain .meta { margin-top: 2px; }

/* ---------- shared atoms: numbered events, chips ---------- */
.events { display: grid; gap: 8px; counter-reset: ev; }
.events li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: start; line-height: 1.5; font-size: .98rem; }
.events .n { width: 22px; height: 22px; border-radius: 50%; background: var(--fc, var(--ink-3)); color: var(--on-fc); display: grid; place-items: center; font: 600 .72rem/1 var(--mono); margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 3px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); font-size: .88rem; line-height: 1.3; }
.chip.threat { border-color: var(--bad); color: var(--bad); background: color-mix(in oklab, var(--bad) 8%, var(--panel)); }
.chip.chance { border-color: var(--good); color: var(--good); background: color-mix(in oklab, var(--good) 8%, var(--panel)); }
.chip.open { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--panel)); }
.chip .k { font: 600 .64rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.trace-lines { display: grid; gap: 2px; font-family: var(--mono); font-size: .72rem; color: var(--ink-2); line-height: 1.5; }

/* ---------- shared atoms: the answer box's parts ---------- */
.answer { display: grid; gap: 8px; margin-top: 4px; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-family: var(--mono); font-size: .74rem; color: var(--ink-2); }
.status .sep { color: var(--ink-3); }
.mockbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font: 500 .66rem var(--mono); color: var(--ink-3); }
.mockbar button { min-height: 28px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); font: inherit; }
.mockbar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.box { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); display: grid; }
.box .form { display: grid; gap: 10px; padding: 12px 14px; }
.box .form .row { display: grid; gap: 4px; }
.box .form .row > .label { font-size: .64rem; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { min-height: var(--tap); padding: 4px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); font-size: .9rem; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.seg button small { font-family: var(--mono); font-size: .68rem; color: var(--ink-3); }
.seg button.stop { border-color: var(--bad); color: var(--bad); }
.box textarea { border: 0; border-top: 1px solid var(--rule); background: transparent; resize: vertical; min-height: 64px; padding: 10px 14px; font: 1rem/1.5 var(--body); color: var(--ink); }
.box textarea::placeholder { color: var(--ink-3); }
.box .send { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--rule); padding: 8px 10px 8px 14px; }
.box .send .hint { font-family: var(--mono); font-size: .72rem; color: var(--ink-3); }
.box .send button { min-height: 44px; min-width: 88px; border: 0; background: var(--accent); color: var(--on-accent); border-radius: 6px; font: 600 .8rem var(--mono); padding: 0 16px; }
.form .pick { display: flex; flex-wrap: wrap; gap: 6px; }
.form .pick button { min-height: 44px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); display: inline-flex; align-items: center; gap: 8px; text-align: left; font-size: .9rem; }
.form .pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.form .pick small { font-family: var(--mono); font-size: .68rem; color: var(--ink-3); }
.form .pick button.spell { font-family: var(--mono); font-size: .76rem; min-height: 36px; }
.box textarea { width: 100%; }
.box .send .hint { min-width: 0; }
.status button { min-height: 32px; padding: 0 10px; border: 1px solid var(--accent); border-radius: 999px; background: var(--panel); color: var(--accent); font: 500 .72rem var(--mono); }

/* ---------- shared atoms: cards, stats, spells, pips, toggles, hex buttons ---------- */
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; min-width: 0; }
.card h3 { font-size: 1.2rem; display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
.card h3 .ic { color: var(--accent); width: 20px; height: 20px; }
.card h3 small { margin-left: auto; font: 500 .72rem var(--mono); color: var(--ink-3); }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(78px, 1fr)); gap: 6px; }
.stat { border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; display: grid; gap: 1px; background: var(--bg); min-width: 0; }
.stat .v { font: 600 1.05rem/1.2 var(--mono); display: flex; align-items: center; gap: 6px; }
.stat .v .ic { color: var(--accent); }
.stat .label { font-size: .6rem; }
.stat .sub { font-family: var(--mono); font-size: .66rem; color: var(--ink-3); }
.hpbig { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; font-family: var(--mono); font-size: .9rem; }
.spell small { font: 500 .66rem var(--mono); color: var(--ink-3); }
.spell.lost { text-decoration: line-through; color: var(--ink-3); border-style: dashed; }
.spell.conc { border-color: var(--accent); }
.spell.free { border-color: var(--good); }
.spell .ic { width: 14px; height: 14px; color: var(--accent); }
.inv { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 10px; font-size: .9rem; }
.inv .label { grid-column: 1 / -1; padding-top: 6px; font-size: .6rem; }
.pips i.off { background: var(--track); }
.feat { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: .92rem; padding: 6px 0; border-top: 1px solid var(--rule); }
.feat .ic { color: var(--accent); }
.toggle { min-height: var(--tap); padding: 0 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); display: inline-flex; align-items: center; gap: 6px; font: 500 .76rem var(--mono); color: var(--ink-2); }
.toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.hexbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.hexbtn { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); text-align: left; font-size: .88rem; }
.hexbtn small { font: 500 .68rem var(--mono); color: var(--ink-3); }
.hexbtn .ic { width: 14px; height: 14px; color: var(--accent); }

/* ---------- Markdown from T.ui.md ---------- */
.md { display: grid; gap: 8px; min-width: 0; }
.md h4 { font-size: 1.1rem; margin-top: 4px; }
.md h5 { font: 600 .72rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.md code { font-family: var(--mono); font-size: .86em; background: var(--panel-2); border-radius: 4px; padding: 0 4px; }
.md ol { list-style: decimal; padding-left: 1.4em; display: grid; gap: 4px; }
.md-table { overflow-x: auto; max-width: 100%; }
.md table { border-collapse: collapse; font-size: .88rem; min-width: 100%; }
.md th, .md td { text-align: left; vertical-align: top; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--rule); }
.md th { font: 600 .68rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } * { transition: none !important; } }
/* ---- css/50-story.css ---- */
/* The Story (owner: Story; web/README.md, File ownership): the stream, month headers and
   day rows, sections by kind, the world's turn, asides, the live card and the activity
   line, the player's bubbles, the answer box's own parts and the "live" button. The shared
   atoms (.sec, .story, .bullets, .ln, .die, .events, .chip, .box, .seg, .pick) are the
   shell's. Most rules are the mockup's (ui/table-mockup.html). */

#story { overflow-anchor: none; }
.stream { display: grid; gap: 12px; min-width: 0; }
.stream > .it { display: grid; gap: 8px; min-width: 0; }
.stream > .it:empty { display: none; }
.stream .empty { color: var(--ink-3); font: 500 .84rem/1.5 var(--mono); padding: 10px 0; }
.sec, .month, .day, .you { scroll-margin-top: calc(var(--now-h) + 8px); }

/* ---------- months and days ---------- */
.older { justify-self: center; min-height: var(--tap); padding: 0 18px; border: 1px dashed var(--rule); border-radius: 22px; background: var(--panel); font: 500 .76rem var(--mono); color: var(--ink-2); }
.month { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; padding-top: 10px; border-top: 3px solid var(--ink-2); margin-top: 6px; cursor: pointer; min-height: var(--tap); position: relative; padding-right: 36px; }
.month h2 { font-size: 1.6rem; }
.month .orders { color: var(--ink-2); font-size: .95rem; flex: 1 1 14em; min-width: 0; }
.month .sum { margin-left: auto; font: 500 .72rem var(--mono); color: var(--ink-3); }
.month .fold { position: absolute; right: 0; top: 10px; width: 32px; height: 32px; display: grid; place-items: center; color: var(--accent); }
.month .fold .ic { transform: rotate(90deg); transition: transform .2s; width: 18px; height: 18px; }
.month.folded .fold .ic { transform: none; }
.month.folded { opacity: .85; }
.month:focus-visible { outline-offset: 4px; }
.day { display: flex; align-items: center; gap: 8px; font: 500 .8rem/1.35 var(--mono); color: var(--ink-2); padding-top: 6px; border-top: 1px solid var(--rule); }
.day > span { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.day b { font-weight: 600; color: var(--ink); }
.day .ic { color: var(--accent); width: 16px; height: 16px; }

/* ---------- sections by kind ---------- */
.sec h3 { overflow-wrap: anywhere; }
.sec .story { display: grid; gap: 8px; }
.sec .meta .num { color: var(--ink); }
.sec.death { border-left: 4px solid var(--bad); }
.sec.death .sec-head .ic { color: var(--bad); }
.sec.opening .sec-head .ic, .sec.wrap .sec-head .ic { color: var(--accent); }
.sec.plain .story p { font-size: .98rem; }
.sec.plain details.trace { border-top-style: dashed; }
.sec.aside.ooc { border-left-color: var(--ink-3); }
.sec.aside h3 { font-size: 1.02rem; margin-bottom: 4px; }
.sec.aside h3 small { font: 500 .7rem var(--mono); color: var(--ink-3); margin-left: 6px; }
.sec.aside .sec-head > div { display: grid; gap: 6px; }
.foe b small.cr { font: 500 .7rem var(--mono); color: var(--ink-3); margin-left: 4px; }
.lines { display: grid; gap: 3px; padding: 2px 0 4px; }
.ln.me .mk { color: var(--accent); }
.ln.gm .mk { color: var(--ink-3); }
.ln.gm .tx { color: var(--ink-2); }
.ln .dice { display: inline; }
.out.muted { color: var(--ink-3); }

/* ---------- the world's turn ---------- */
.sec.world { background: var(--world); border-color: var(--world-rule); border-left-width: 5px; }
.sec.world .sec-head .ic { color: var(--world-rule); }
.sec.world .chip { background: color-mix(in oklab, var(--panel) 70%, var(--world)); }
.part { display: grid; gap: 6px; padding-top: 8px; border-top: 1px solid color-mix(in oklab, var(--world-rule) 40%, transparent); }
.part h4 { font-size: 1.05rem; }
.part p { line-height: 1.55; }
.sec.world .events li { scroll-margin-top: calc(var(--now-h) + 8px); }
.sec.world .events li:target { background: color-mix(in oklab, var(--fc, var(--accent)) 14%, transparent); border-radius: 6px; }
.events .hexes { font: 500 .68rem var(--mono); color: var(--ink-3); white-space: nowrap; }
.events li.else .n { background: none; color: var(--ink-3); }
.delta-rows { display: grid; gap: 4px; }
.delta-rows li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; padding: 4px 0; border-bottom: 1px dashed color-mix(in oklab, var(--world-rule) 35%, transparent); font-size: .94rem; }
.delta-rows li:last-child { border-bottom: 0; }
.delta-rows .ba { font-size: .8rem; color: var(--ink-2); }
.delta-rows .ba b { color: var(--ink); font-weight: 600; }
.delta-rows .arr { color: var(--accent); }
.delta-rows li.same .what { color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip { max-width: 100%; }
.trace-lines .label { margin-top: 6px; font-size: .6rem; }
.trace-lines span { overflow-wrap: anywhere; }

/* ---------- the live card and the activity line ---------- */
.sec.live { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent); }
.live-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; }
.live-tag.paused { color: var(--ink-3); }
.sec.live .beat { display: grid; gap: 3px; padding: 2px 0; }
.sec.live .beat .bt { font-size: .98rem; line-height: 1.5; }
.sec.live .beat:last-child { animation: grow .5s ease-out; }
@keyframes grow { from { opacity: .3; } to { opacity: 1; } }
.activity { display: grid; gap: 4px; font-family: var(--mono); font-size: .72rem; color: var(--ink-3); padding-left: 14px; }
.activity li { overflow-wrap: anywhere; }
.activity li + li::before { content: "↳ "; }

/* ---------- the player's words ---------- */
.you p { overflow-wrap: anywhere; }
.you.ooc { border-style: dashed; }
.you.ooc p { font-style: italic; color: var(--ink-2); }
.you.sent, .you.sending { border-color: var(--accent); }
.you.sending { opacity: .8; }
.you.failed { border-color: var(--bad); }
.you .st { font: 500 .66rem var(--mono); color: var(--ink-3); }
.you .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.you .acts button { min-height: var(--tap); padding: 0 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); font: 500 .72rem var(--mono); }

/* ---------- the answer box ---------- */
.answer { scroll-margin-bottom: 80px; }
.answer .status { min-height: 24px; }
.answer .status .who-move { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
.answer .status .who-move.mine { color: var(--good); }
.answer .status button { min-height: var(--tap); }
.wait { height: 2px; background: var(--rule); border-radius: 1px; overflow: hidden; }
.wait i { display: block; width: 0; height: 100%; background: var(--accent); opacity: .7; animation: wait 120s linear infinite alternate; }
@keyframes wait { from { width: 0; } to { width: 100%; } }
.box:focus-within { border-color: var(--accent); }
.box .form:empty, .box .form[hidden] { display: none; }
.box .form .row > .label small { text-transform: none; letter-spacing: 0; }
.box .foes { margin-top: 4px; }
.form .pick button { max-width: 100%; }
.form .pick button > span { min-width: 0; overflow-wrap: anywhere; }
.form .pick button:disabled { opacity: .5; border-style: dashed; }
.form .pick .small { font-size: .82rem; align-self: center; }
.form .pick .sw { width: 12px; height: 12px; }
.form .gp { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; font-size: .9rem; }
.form .gp input { width: 7em; min-height: var(--tap); padding: 0 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); font-family: var(--mono); }
.seg button { max-width: 100%; }
.board { display: grid; gap: 2px; padding: 8px 10px; border-radius: 6px; background: var(--bg); font: .76rem/1.5 var(--mono); color: var(--ink-2); }
.board p { overflow-wrap: anywhere; }
.box .send { flex-wrap: wrap; }
.box .send .hint { flex: 1 1 8em; }
.box .send .btns { display: flex; gap: 6px; margin-left: auto; }
.box .send button.second { background: var(--panel); color: var(--accent); border: 1px solid var(--accent); min-width: 0; }
.box .send button.toggle.ooc { min-height: var(--tap); min-width: 0; padding: 0 12px; background: var(--panel); color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; font: 500 .74rem var(--mono); }
.box .send button.toggle.ooc[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.closed-why { grid-template-columns: 1fr; }

/* ---------- the "live" button ---------- */
.jump { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); justify-self: end; z-index: 4; min-height: var(--tap); padding: 0 16px; border: 1px solid var(--accent); border-radius: 999px; background: var(--panel); color: var(--accent); font: 600 .78rem var(--mono); display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 10px color-mix(in oklab, var(--ink) 18%, transparent); margin-top: -44px; }
.jump .ic.down { transform: rotate(90deg); }
@media (min-width: 900px) { .jump { bottom: 16px; } }
@media (prefers-reduced-motion: reduce) { .wait i { animation: none; width: 35%; } .sec.live .beat:last-child { animation: none; } }
.live-wrap { display: grid; min-width: 0; }
/* ---- css/60-fight.css ---- */
/* The fight card (T.panels.fightCard) and the Fights tab. The shared atoms (.sec, .foes,
   .foe, .hprow, details.trace, .round, .ln, .die, .result, .bullets) are the shell's;
   these are the card's own: its meta line, the HP track, the live state, the rows. */

/* ---------- the card ---------- */
.fcard .sec-head h3 { overflow-wrap: anywhere; }
.fcard .meta > span + span::before { content: "·"; margin-right: 10px; color: var(--ink-3); font-weight: 400; }
.fcard .meta { gap: 2px 10px; }
.fcard .meta.when { color: var(--ink-3); margin-top: 2px; }
.fcard .meta.when::before { content: none; }
.fcard .out.good { color: var(--good); } .fcard .out.warn { color: var(--warn); } .fcard .out.bad { color: var(--bad); }
.fcard .out.brass { color: var(--accent); } .fcard .out.muted { color: var(--ink-3); }
.fcard .verdict { font-style: italic; font-family: var(--body); font-size: .86rem; color: var(--ink-2); }
.fcard .foe b .ct { font-family: var(--mono); font-weight: 500; color: var(--ink-2); font-size: .82rem; }
.fcard .foe .stats { overflow-wrap: anywhere; line-height: 1.5; }
.fcard .foe .hp .ic { width: 13px; height: 13px; }
.fcard .hprow .hp.me .nm { color: var(--accent); font-weight: 600; }
.fcard .hprow .hp.down b { color: var(--bad); }
.fcard .hprow .hp b { font-weight: 600; white-space: nowrap; }
.fcard.live { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent); }
.fcard .live-tag { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; }
.fcard .rounds { display: grid; gap: 4px; }
.fcard .waiting { font: .76rem var(--mono); }
.fcard .beat-tx { font-size: .95rem; line-height: 1.5; color: var(--ink); padding: 2px 0 2px; }
.fcard .ln.me .mk { color: var(--accent); }
.fcard .ln.gm { color: var(--ink-2); }
.fcard .ln.gm .mk { color: var(--ink-3); }
.fcard .ln.them { padding-left: 14px; color: var(--ink-2); }
.fcard .ln .tx b { color: var(--ink); font-weight: 600; }
.fcard .ln .dice { display: inline; }
.fcard .tag-fizz { font: 600 .64rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--bad); border: 1px dashed var(--bad); border-radius: 4px; padding: 0 4px; }
.fcard .result .ic { width: 13px; height: 13px; margin-right: 4px; color: var(--accent); }
.fcard .result > span { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0 4px; }
.fcard .result .lost b { color: var(--bad); }
.fcard .result .warn { color: var(--warn); }

/* ---------- the HP track ---------- */
.fcard .track { margin: 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); padding: 8px 10px 4px; display: grid; gap: 4px; min-width: 0; }
.fcard .track figcaption { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.fcard .track .legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font: .7rem var(--mono); color: var(--ink-2); }
.fcard .track .legend > span { display: inline-flex; align-items: center; gap: 5px; }
.fcard .track .legend svg { width: 18px; height: 6px; overflow: visible; }
.fcard .track > svg { width: 100%; max-width: 440px; height: auto; display: block; overflow: visible; cursor: pointer; justify-self: center; }
.fcard .track .grid { stroke: var(--rule); stroke-width: 1; }
.fcard .track .tick { font: 9px var(--mono); fill: var(--ink-3); }
.fcard .track .ln { fill: none; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.fcard .track .ln.m { stroke: var(--accent); stroke-width: 2.6; }
.fcard .track .ln.f0, .fcard .track .ln.f2 { stroke: var(--ink-2); }
.fcard .track .ln.f1, .fcard .track .ln.f3 { stroke: var(--ink-3); }
.fcard .track .dot { stroke: var(--bg); stroke-width: 1.5; }
.fcard .track .dot.m { fill: var(--accent); }
.fcard .track .dot.f0, .fcard .track .dot.f2 { fill: var(--ink-2); }
.fcard .track .dot.f1, .fcard .track .dot.f3 { fill: var(--ink-3); }
.fcard .track .dot.dead { fill: var(--bad); }
.fcard .track .end { font: 9.5px var(--mono); dominant-baseline: middle; fill: var(--ink-2); }
.fcard .track .end.m { fill: var(--accent); font-weight: 600; }
.fcard .numbers > summary { list-style: none; cursor: pointer; min-height: var(--tap); display: flex; align-items: center; gap: 8px; font: 500 .72rem var(--mono); color: var(--accent); }
.fcard .numbers > summary::-webkit-details-marker { display: none; }
.fcard .numbers > summary .ic { transition: transform .2s; }
.fcard .numbers[open] > summary .ic { transform: rotate(90deg); }
.fcard .numbers .scroll { overflow-x: auto; max-width: 100%; padding-bottom: 6px; }
.fcard .numbers table { border-collapse: collapse; font: .72rem var(--mono); font-variant-numeric: tabular-nums; }
.fcard .numbers th, .fcard .numbers td { padding: 2px 6px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.fcard .numbers th { color: var(--ink-3); font-weight: 500; }
.fcard .numbers tbody th { text-align: left; color: var(--ink-2); }
.fcard .numbers tbody th small { color: var(--ink-3); font-size: .64rem; }
.fcard .numbers td.zero { color: var(--bad); font-weight: 600; }

/* ---------- the Fights tab ---------- */
.fights .frows { display: grid; gap: 6px; }
.fights .fitem { display: grid; gap: 8px; min-width: 0; }
.fights .fitem.open > .fcard { margin-bottom: 8px; }
.frow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; min-height: var(--tap); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); text-align: left; width: 100%; font-size: .95rem; line-height: 1.35; }
.frow[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
.frow .pip { width: 12px; height: 12px; border-radius: 50%; background: var(--good); grid-row: span 2; }
.frow .pip.hurt { background: var(--warn); } .frow .pip.dead { background: var(--bad); } .frow .pip.off { background: var(--ink-3); }
.frow .pip.going { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent); }
.frow .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.frow .t small { font: 500 .7rem var(--mono); }
.frow .m { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); grid-column: 2; min-width: 0; overflow-wrap: anywhere; }
.frow .r { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); grid-row: span 2; text-align: right; white-space: nowrap; }
.frow .r .good { color: var(--good); } .frow .r .warn { color: var(--warn); } .frow .r .bad { color: var(--bad); }
.frow .r .brass { color: var(--accent); } .frow .r .muted { color: var(--ink-3); }
.fights .hint, .fights .empty { font-size: .86rem; }
/* grid children shrink to the card (a wide numbers table scrolls inside its own box) */
.fcard { grid-template-columns: minmax(0, 1fr); }
.fcard > *, .fcard .track > *, .fights .fitem > * { min-width: 0; }
.fcard .track { grid-template-columns: minmax(0, 1fr); }
.fcard .track .gone { fill: none; stroke: var(--bad); stroke-width: 1; stroke-dasharray: 1 3; opacity: .55; }
/* inside a .card (the Fights tab) the shell's .card h3 is a flex row; the card's own head is text */
.fcard .sec-head h3 { display: block; }
.fcard .sec-head h3 small { margin-left: 6px; white-space: nowrap; }
.fights .fcard { padding: 10px 10px 12px; }
/* ---- css/62-morten.css ---- */
/* The Morten tab: the sheet's cards. The shared atoms (.card, .hpbig, .stat-row, .stat,
   .spells, .spell, .inv, .pips, .feat, .chip, .toggle) are the shell's; these are the
   tab's own. */
#morten .chips { display: flex; flex-wrap: wrap; gap: 6px; }
#morten .chip .ic { width: 14px; height: 14px; }
#morten .chip.quiet { color: var(--ink-3); }
#morten .chip.glyph.lit { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--panel)); }
#morten .chip.glyph.spent { color: var(--ink-3); border-style: dashed; }
#morten .chip.glyph.spent span { text-decoration: line-through; }
#morten .chip.open .k, #morten .chip.threat .k { margin-right: 2px; }
#morten .chip .k { font: 600 .62rem var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
#morten .hpbig .ic { color: var(--bad); width: 20px; height: 20px; }
#morten .hpbig .bar { height: 12px; }
#morten .hpbig b { font-weight: 600; white-space: nowrap; }
#morten .hpbig.xp .ic { color: var(--accent); }
#morten .xp-bar > i { background: var(--accent); }
#morten .stat .v { min-width: 0; overflow-wrap: anywhere; }
#morten .stat .sub { overflow-wrap: anywhere; }

/* spells */
#morten .spells { display: flex; flex-wrap: wrap; gap: 6px; }
#morten .spell { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 0 6px; min-height: var(--tap); padding: 4px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); font-size: .9rem; text-align: left; line-height: 1.25; align-content: center; }
#morten .spell[aria-pressed="true"] { box-shadow: 0 0 0 2px color-mix(in oklab, var(--accent) 45%, transparent); }
#morten .spell.lost .nm { text-decoration: line-through; }
#morten .spell.lost { text-decoration: none; color: var(--ink-3); border-style: dashed; border-color: var(--bad); }
#morten .spell.lost small.back { color: var(--bad); }
#morten .spell.ritual small { color: var(--ink-2); }
#morten .sline { border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 6px 6px 0; padding: 6px 10px; display: grid; gap: 2px; font-size: .92rem; }
#morten .sline small { font: 500 .7rem var(--mono); color: var(--ink-3); }
#morten .sline p { line-height: 1.45; }
#morten .arow { display: flex; flex-wrap: wrap; gap: 6px; }
#morten button.chip { min-height: var(--tap); font: inherit; font-size: .88rem; }
#morten .hint { font-size: .82rem; }

/* fighting */
#morten .atks { display: grid; gap: 0; font-size: .9rem; }
#morten .atk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; padding: 5px 0; border-top: 1px solid var(--rule); }
#morten .atk.head { border-top: 0; padding-top: 0; font: 600 .6rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
#morten .atk.head span:last-child { display: none; }
#morten .atk b { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
#morten .atk .hit { font: 600 .8rem var(--mono); text-align: right; }
#morten .atk .dmg { grid-column: 1 / -1; font: .74rem var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
#morten .abil { grid-template-columns: repeat(3, minmax(0, 1fr)); }
#morten .abil .stat.prof { border-color: var(--accent); }
#morten .abil .v small { font-size: .74rem; }
#morten .skills .chip b { font-weight: 600; }

/* gear */
#morten .load { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; font-family: var(--mono); font-size: .82rem; }
#morten .load b { font-weight: 600; white-space: nowrap; }
#morten .load-bar { height: 10px; }
#morten .load-bar > i { background: var(--ink-3); }
#morten .load-bar.mid > i { background: var(--warn); }
#morten .load-bar.low > i { background: var(--bad); }
#morten .inv { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 10px; font-size: .9rem; align-items: baseline; }
#morten .inv .label { grid-column: 1 / -1; padding-top: 6px; font-size: .6rem; display: flex; align-items: center; gap: 6px; }
#morten .inv .nm { min-width: 0; overflow-wrap: anywhere; }
#morten .inv .nm small { display: block; font-size: .76rem; color: var(--ink-3); line-height: 1.35; }
#morten .inv .nm.none { color: var(--ink-3); }
#morten .inv .kg, #morten .inv .ct { font-family: var(--mono); font-size: .74rem; color: var(--ink-2); text-align: right; white-space: nowrap; }
#morten .pips { display: inline-flex; flex-wrap: wrap; gap: 3px; vertical-align: middle; margin-left: 2px; }
#morten .pips i { width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }

/* habits and features */
#morten .mhabits .toggle { justify-self: start; }
#morten details.mfeat > summary { list-style: none; cursor: pointer; min-height: var(--tap); display: flex; align-items: center; gap: 8px; font: 500 1.05rem var(--display); }
#morten details.mfeat > summary::-webkit-details-marker { display: none; }
#morten details.mfeat > summary .ic { color: var(--accent); transition: transform .2s; }
#morten details.mfeat[open] > summary .ic { transform: rotate(90deg); }
#morten details.mfeat > summary small { margin-left: auto; font: 500 .72rem var(--mono); color: var(--ink-3); }
#morten .feat { grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; }
#morten .feat .ic { margin-top: 4px; }
#morten .feat b { font-weight: 600; }
#morten .feat .st { font: 500 .7rem var(--mono); color: var(--ink-3); }
/* ---- css/70-realm.css ---- */
/* The Realm tab: the tower card, the map, the hex entry and the realm rows. Mostly the
   mockup's rules (ui/table-mockup.html, "the realm"), scoped to #realm. */
#realm > [data-part]:empty { display: none; }
#realm .small { font-size: .86rem; }
#realm .pips { display: inline-flex; gap: 3px; vertical-align: middle; }
#realm .pips i { width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
#realm .pips i.off { background: var(--track); }
#realm .chips { display: flex; flex-wrap: wrap; gap: 6px; }
#realm .chips .chip { max-width: 100%; }
#realm .code { font: 500 .72rem var(--mono); color: var(--ink-3); }

/* ---------- the tower card ---------- */
#realm .tower { border-top: 5px solid var(--f-tower); }
#realm .tower .hpbig .bar { height: 9px; }
#realm .tower .attrs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-family: var(--mono); font-size: .82rem; }
#realm .tower .attrs > span { display: inline-flex; align-items: center; gap: 5px; }
#realm .tower .attrs b { font-weight: 600; font-size: .98rem; }
#realm .tower .attrs .ic { color: var(--accent); width: 18px; height: 18px; }
#realm .tower .attrs .dot { color: var(--ink-3); }
#realm .gold { font-size: .95rem; color: var(--ink-2); }
#realm .gold b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
#realm .sub, #realm .nextm { display: grid; gap: 6px; }
#realm .rel { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; }
#realm .rel .links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#realm .rlink { min-height: var(--tap); display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px; border: 1px solid var(--rule); border-left: 4px solid var(--fc); border-radius: 8px; background: var(--bg); font-weight: 600; }
#realm .rlink small { font: 500 .68rem var(--mono); color: var(--bad); }

/* ---------- the map ---------- */
#realm .mapbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#realm .mapbar .hint { color: var(--ink-3); font-size: .82rem; margin-left: auto; }
#realm .mapbar .toggle .ic { width: 18px; height: 18px; }
#realm .mapbar .toggle[data-t="key"] { width: var(--tap); padding: 0; justify-content: center; }
#realm .frame { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); background: var(--table); position: relative; min-width: 0; }
#realm .frame svg { display: block; width: 100%; height: auto; max-height: 78vh; max-height: 78dvh; user-select: none; -webkit-user-select: none; }
#realm .map text { font-family: var(--mono); }
#realm .map .land { fill: color-mix(in oklab, var(--fc) var(--mix), var(--land)); stroke: color-mix(in oklab, var(--ink) 18%, transparent); stroke-width: 1; }
#realm .map .border { fill: none; stroke: var(--ink-2); stroke-width: 2.2; stroke-linecap: round; opacity: .75; }
#realm .map .river { fill: none; stroke: var(--water); stroke-width: 6; stroke-linecap: round; }
#realm .map .lake { fill: var(--water); stroke: color-mix(in oklab, var(--water) 60%, var(--ink)); stroke-width: .8; }
#realm .map .hid { fill: var(--ink-2); font-size: 8.5px; font-weight: 500; letter-spacing: .04em; }
#realm .map.nocodes .hid { display: none; }
#realm .map .lvl { fill: var(--ink); font-family: var(--display); font-size: 24px; font-weight: 700; }
#realm .map .glyph { fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
#realm .map .crown { fill: var(--fc); stroke: var(--ink); stroke-width: .9; stroke-linejoin: round; }
#realm .map .tower-g { fill: var(--fc); stroke: var(--ink); stroke-width: .9; stroke-linejoin: round; }
#realm .map .tok { fill: var(--fc); stroke: var(--halo); stroke-width: 1.2; }
#realm .map .fac-none .tok { fill: var(--f-other); }
#realm .map .tok-g { fill: none; stroke: var(--on-fc); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
#realm .map .ring { fill: none; stroke: var(--track); stroke-width: 2.2; }
#realm .map .ring.on { stroke: var(--good); }
#realm .map .ring.on.mid { stroke: var(--warn); }
#realm .map .ring.on.low { stroke: var(--bad); }
#realm .map .pip { fill: var(--ink-2); }
#realm .map .hostile { stroke: var(--bad); stroke-width: 2; stroke-dasharray: 3 2; fill: none; }
#realm .map .skull-b { fill: var(--bad); stroke: var(--halo); stroke-width: 1; }
#realm .map .skull-g { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
#realm .map .more-t { fill: var(--on-fc); font-size: 7.5px; font-weight: 600; }
#realm .map .tokn.more .tok { fill: var(--ink-3); }
#realm .map .morten-ring { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 7 4; }
#realm .map .morten-pin { fill: var(--accent); stroke: var(--halo); stroke-width: 1.5; }
#realm .map .morten-g { fill: var(--on-accent); }
#realm .map .picked { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linejoin: round; }
#realm .map .arrow { fill: none; stroke: var(--fc); stroke-width: 3; stroke-linecap: round; }
#realm .map .arrow-halo { fill: none; stroke: var(--halo); stroke-width: 7; stroke-linecap: round; opacity: .85; }
#realm .map .head-a { fill: var(--fc); stroke: var(--halo); stroke-width: 1.2; stroke-linejoin: round; }
#realm .map .badge { fill: var(--fc); stroke: var(--halo); stroke-width: 1.8; }
#realm .map .fac-none .badge, #realm .map .fac-none .arrow, #realm .map .fac-none .head-a { fill: var(--f-other); }
#realm .map .mv.on .badge { stroke: var(--ink); stroke-width: 2.4; }
#realm .map .badge-t { fill: var(--on-fc); font-size: 10px; font-weight: 600; pointer-events: none; }
#realm .map .mv .arrow, #realm .map .mv .arrow-halo, #realm .map .mv .head-a, #realm .map .mv .badge { pointer-events: none; }
#realm .map .evhit { fill: transparent; cursor: pointer; pointer-events: all; -webkit-tap-highlight-color: transparent; }
#realm .map .hit { fill: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#realm .map .hit:focus-visible, #realm .map .evhit:focus-visible { outline: none; stroke: var(--accent); stroke-width: 3; }
#realm .keyover { position: absolute; inset: 8px; overflow: auto; overscroll-behavior: contain; background: color-mix(in oklab, var(--panel) 95%, transparent); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; align-content: start; font-size: .9rem; }
#realm .keyover ul { display: grid; gap: 8px; }
#realm .keyover li { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 10px; }
#realm .keyover li .ic { color: var(--accent); width: 18px; height: 18px; }
#realm .keyover .klvl { font: 700 1.3rem var(--display); text-align: center; }
#realm .keyover .ktok { width: 26px; height: 26px; border-radius: 50%; background: var(--fc); color: var(--on-fc); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--good); }
#realm .keyover .ktok .ic { color: var(--on-fc); width: 15px; height: 15px; }
#realm .keyover .kic { display: grid; place-items: center; }
#realm .keyover .kic.bad .ic { color: var(--bad); }
#realm .keyover .kn { width: 22px; height: 22px; border-radius: 50%; background: var(--ink-3); color: var(--bg); display: grid; place-items: center; font: 600 .72rem var(--mono); justify-self: center; }
#realm .keyover .kriv { height: 5px; border-radius: 3px; background: var(--water); }
#realm .keyover .kpips { display: grid; place-items: center; }
#realm .keyover > .toggle { justify-self: start; }
#realm .evline li { grid-template-columns: 24px minmax(0, 1fr) auto; background: var(--panel); border: 1px solid var(--rule); border-left: 4px solid var(--fc); border-radius: 8px; padding: 4px 4px 4px 10px; align-items: center; }
#realm .evline .x { min-width: var(--tap); min-height: var(--tap); border: 0; background: none; color: var(--ink-3); font-size: 1.2rem; }

/* ---------- the hex entry ---------- */
#realm .entry { scroll-margin-top: calc(var(--now-h, 64px) + 10px); }
#realm .entry h3 { font-size: 1.3rem; display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
#realm .entry h3 .code { margin-left: 0; }
#realm .entry .line { color: var(--ink-2); font-size: .95rem; overflow-wrap: anywhere; }
#realm .entry .line b { color: var(--ink); }
#realm .entry .line .brass { color: var(--accent); }
#realm .entry .way { font: .78rem var(--mono); color: var(--ink-3); }
#realm .entry .lvl-line { font-size: .9rem; color: var(--ink-3); }
#realm .entry > .label { margin-top: 2px; }
#realm .pieces { display: grid; gap: 6px; }
#realm .piece { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--rule); border-left: 5px solid var(--fc); min-width: 0; }
#realm .piece .body { flex: 1 1 auto; min-width: 0; display: grid; gap: 3px; }
#realm .piece .tok-big { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--fc); color: var(--on-fc); display: grid; place-items: center; margin-top: 2px; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--good); }
#realm .piece .tok-big.mid { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--warn); }
#realm .piece .tok-big.low { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--bad); }
#realm .piece.hostile .tok-big { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--bad); }
#realm .piece .tok-big .ic { width: 20px; height: 20px; stroke-width: 1.9; }
#realm .piece .pn { display: flex; align-items: baseline; gap: 2px 8px; flex-wrap: wrap; }
#realm .piece .pn b { font-weight: 700; }
#realm .piece .pn small { font: 500 .7rem var(--mono); color: var(--ink-3); }
#realm .piece .pn .hos { display: inline-flex; align-items: center; gap: 4px; font: 600 .66rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--bad); }
#realm .piece .hp { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: .74rem; flex-wrap: wrap; }
#realm .piece .hp .ic { color: var(--bad); }
#realm .piece .hp .bar { width: 70px; flex: none; }
#realm .piece .hp .pips { margin-left: 4px; }
#realm .piece .what { font-size: .88rem; color: var(--ink-2); }
#realm .piece .at { font: 500 .72rem var(--mono); color: var(--ink-3); }
#realm .do { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
#realm .do span { font: 500 .7rem var(--mono); color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 3px 8px; }
#realm .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 4px; }
#realm .room { min-height: 44px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); display: grid; align-content: center; gap: 1px; padding: 4px 8px; font-size: .78rem; color: var(--ink-3); min-width: 0; }
#realm .room b { font: 600 .74rem var(--mono); color: var(--ink-2); }
#realm .room small { font-size: .74rem; line-height: 1.25; overflow-wrap: anywhere; }
#realm .room small.nt { font-style: italic; }
#realm .room.done { border-color: color-mix(in oklab, var(--good) 60%, var(--rule)); }
#realm .room.done b, #realm .room .ok { color: var(--good); font-style: normal; }
#realm .room.now { border-color: var(--accent); background: var(--accent-soft); }
#realm .room.now b { color: var(--accent); }
#realm .heard { display: grid; gap: 6px; }
#realm .heard li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: .9rem; color: var(--ink-2); line-height: 1.45; }
#realm .heard .ic { color: var(--ink-3); margin-top: 3px; }
#realm .hexbtn { max-width: 100%; }
#realm .hexbtn > span:not(.sw) { min-width: 0; }
#realm .hexbtn .ic { color: var(--ink-2); }
#realm .hexbtn .hn { display: grid; gap: 0; line-height: 1.25; }

/* ---------- the realm rows ---------- */
#realm .rrows { display: grid; gap: 6px; }
#realm .rrow { border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); border-left: 5px solid var(--fc); min-width: 0; scroll-margin-top: calc(var(--now-h, 64px) + 10px); }
#realm .rhead { width: 100%; min-height: var(--tap); display: grid; grid-template-columns: 11px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 8px 10px; border: 0; background: none; text-align: left; }
#realm .rhead .sw { margin-top: 7px; }
#realm .rhead .top { display: flex; align-items: baseline; gap: 2px 8px; flex-wrap: wrap; min-width: 0; }
#realm .rhead .top b { font-size: 1.05rem; font-weight: 700; color: var(--fc); }
#realm .rhead .top .lv { font-size: .88rem; color: var(--ink-2); }
#realm .rhead .sts { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; }
#realm .rhead .st { font: 600 .66rem var(--mono); letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
#realm .rhead .nums { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-family: var(--mono); font-size: .74rem; color: var(--ink-2); }
#realm .rhead .nums > span { display: inline-flex; align-items: center; gap: 4px; }
#realm .rhead .nums .bar { width: 56px; flex: none; }
#realm .rhead .nums .ic { color: var(--accent); }
#realm .rhead .nums .reg .ic { color: var(--bad); }
#realm .rhead .chev { grid-row: 1 / span 2; grid-column: 3; align-self: center; color: var(--ink-3); transition: transform .15s; }
#realm .rrow[data-open="true"] .rhead .chev { transform: rotate(90deg); }
#realm .rrow .more { display: grid; gap: 8px; padding: 8px 10px 10px 31px; border-top: 1px solid var(--rule); font-size: .92rem; color: var(--ink-2); min-width: 0; }
#realm .rrow .goal { display: flex; gap: 6px; align-items: baseline; }
#realm .rrow .goal .ic { color: var(--accent); flex: none; }
#realm .rrow .piece { background: var(--panel); }

/* in the drawer (from 900 px): no full bleed, the map in a rounded frame */
@media (min-width: 900px) {
  #realm .frame { margin-left: 0; margin-right: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--rule); }
  #realm .frame svg { max-height: calc(100vh - var(--now-h, 64px) - 120px); max-height: calc(100dvh - var(--now-h, 64px) - 120px); }
  #realm .entry, #realm .rrow { scroll-margin-top: 60px; }
}
@media (max-width: 420px) {
  #realm .rrow .more { padding-left: 10px; }
}
/* ---- css/80-more.css ---- */
/* The More panels: Months, Rules, Talk, Table (owner: see web/README.md, File ownership).
   Rows and dials are the mockup's (ui/table-mockup.html, "more"); the shared atoms
   (.card, .seg, .box, .sec.aside, .you, .note, .md, .toggle) are in 10-shell.css. */

.more-card h3 small { margin-left: auto; }
.more-card .empty, #rules .empty, #talk .empty { font-size: .92rem; }

/* ---------- Months ---------- */
.months { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 8px; align-items: start; }
.mrow .n { padding-top: 6px; }
.mrow .n b { font-family: var(--display); font-weight: 500; font-size: 1.1rem; line-height: 1.1; display: block; }
.mrow .n small { display: block; margin-top: 2px; font: 500 .6rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.mrow.playing .n small { color: var(--accent); }
.mrow .cell { position: relative; width: 100%; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; min-height: 44px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); padding: 8px 34px 8px 10px; font-size: .9rem; line-height: 1.4; text-align: left; }
.mrow.playing .cell { border-color: var(--accent); }
.mrow .cell:hover { border-color: var(--accent); }
.mrow .cell .go { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.mrow .cell small { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); }
.mrow .route { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; min-width: 0; }
.mrow .route .ic { color: var(--accent); align-self: center; }
.mrow .route small { font-size: .64rem; color: var(--ink-3); }
.mrow .route .arr { color: var(--ink-3); }
.mrow .fightpips { display: inline-flex; align-items: center; gap: 6px; }
.mrow .fightpips small { color: var(--ink-3); }
.mrow .pips { display: inline-flex; flex-wrap: wrap; gap: 3px; vertical-align: middle; }
.mrow .pips i { width: 10px; height: 10px; border-radius: 50%; background: var(--track); }
.mrow .pips i.won { background: var(--good); }
.mrow .pips i.going { background: var(--accent); }
.mrow .pips i.lost { background: var(--bad); }
.mrow .pips i.fled { background: var(--warn); }
.mrow .pips i.bypassed { background: transparent; box-shadow: inset 0 0 0 2px var(--good); }
.mrow .cell small.deaths { color: var(--bad); display: inline-flex; align-items: center; gap: 4px; }
.mrow .world { flex-basis: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; align-items: start; color: var(--ink-2); font-size: .88rem; border-top: 1px dashed var(--rule); padding-top: 6px; }
.mrow .world .ic { margin-top: 3px; color: var(--world-rule); }
.mrow .world small { display: block; color: var(--ink-3); font-size: .68rem; }

/* ---------- Rules ---------- */
.toc { display: flex; flex-wrap: wrap; gap: 6px; }
.toc button { min-height: var(--tap); padding: 4px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); font-size: .9rem; text-align: left; }
.toc button:hover { border-color: var(--accent); }
.toc-bar { display: flex; justify-content: flex-end; }
details.rule { padding: 0 14px; gap: 0; scroll-margin-top: calc(var(--now-h) + 10px); }
details.rule > summary { list-style: none; cursor: pointer; min-height: 52px; display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 1.15rem; }
details.rule > summary::-webkit-details-marker { display: none; }
details.rule > summary .ic { color: var(--accent); transition: transform .2s; }
details.rule[open] > summary .ic { transform: rotate(90deg); }
details.rule > .md { padding: 4px 0 14px; border-top: 1px solid var(--rule); padding-top: 10px; }
details.rule .md p, details.rule .md li { font-size: .96rem; line-height: 1.55; }

/* ---------- Talk ---------- */
.talk-list { display: grid; gap: 12px; }
.talk-list .sec.aside h3 { font-size: 1.05rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.talk-list .sec.aside h3 small { margin-left: 0; font: 500 .7rem var(--mono); color: var(--ink-3); }
.talk-list .sec.aside p + p { margin-top: 6px; }
.talk-list .you { max-width: 92%; }
.talk-list .you.pending, .talk-list .you.sent { border-style: dashed; }
.talk-list .you.failed { border-color: var(--bad); }
.talk-list .you .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.talk-list .you .acts button { min-height: var(--tap); padding: 0 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); font: 500 .74rem var(--mono); }
.talk-box textarea { border-top: 0; border-radius: 8px 8px 0 0; }

/* ---------- Table ---------- */
.dials .dial { display: grid; gap: 6px; padding: 10px 0 8px; border-top: 1px solid var(--rule); }
.dials .dial .d { display: flex; align-items: baseline; gap: 2px 8px; flex-wrap: wrap; }
.dials .dial .d b { font-weight: 700; }
.dials .dial .d small { color: var(--ink-3); font-size: .82rem; }
.dials .pending { font: 500 .68rem var(--mono); color: var(--warn); margin-left: auto; }
.dials .pending:empty { display: none; }
.dials .seg button { text-align: left; min-width: var(--tap); justify-content: center; }
.dials .seg button.was { border-style: dashed; }
.dials .seg button.was small { color: var(--ink-3); }
.dials .seg button[aria-pressed="true"] small { color: var(--ink-2); }
.preset-seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.preset-seg button { flex-direction: column; align-items: flex-start; gap: 0; padding: 6px 12px; }
.preset-seg button span { font-weight: 700; }
.preset-seg button small { font-family: var(--body); font-size: .8rem; line-height: 1.3; }
.dials .take { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 10px; font-size: .95rem; }
.dials .take > span:first-child { flex: 1 1 12em; }
.dials .take .pending { margin-left: 0; }
.dials button.primary { min-height: var(--tap); padding: 0 16px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font: 600 .8rem var(--mono); display: inline-flex; align-items: center; gap: 8px; }
.dials .watch { display: flex; align-items: center; gap: 8px; font-size: .9rem; padding-bottom: 8px; }
.dials .err { font: .8rem var(--mono); padding-bottom: 8px; }
.habit-list { display: grid; gap: 6px; }
.habit { display: grid; grid-template-columns: minmax(0, 1fr) var(--tap); gap: 4px; align-items: start; }
.habit textarea { width: 100%; min-height: var(--tap); border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); padding: 8px 10px; font: .95rem/1.45 var(--body); resize: vertical; field-sizing: content; }
.habit button { width: var(--tap); height: var(--tap); border: 1px solid transparent; border-radius: 8px; background: none; color: var(--ink-3); display: grid; place-items: center; }
.habit button:hover { color: var(--bad); border-color: var(--rule); }
.habit-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }

/* ---------- unread dots on the shell's tab buttons ---------- */
.subtabs button { position: relative; }
.subtabs button .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

/* rules text: bold in a bullet is emphasis, not the story's small-caps label */
details.rule .md .bullets b, .talk-list .md .bullets b { font: inherit; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--ink); margin: 0; }
.mrow .route > span { white-space: nowrap; }

/* a drawer tab's first-visit note, placed before its pane (80-more.js: placeNotes) */
.tab-note { display: none; }
.tab-note:empty { display: none !important; }
@media (max-width: 899.98px) {
  .app[data-view="morten"] .tab-note[data-for="morten"], .app[data-view="realm"] .tab-note[data-for="realm"],
  .app[data-view="fights"] .tab-note[data-for="fights"] { display: block; }
}
@media (min-width: 900px) {
  .app[data-drawer="morten"] .tab-note[data-for="morten"], .app[data-drawer="realm"] .tab-note[data-for="realm"],
  .app[data-drawer="fights"] .tab-note[data-for="fights"] { display: block; }
}
