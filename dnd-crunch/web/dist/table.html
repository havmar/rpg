    if (!foesWords && foes.length) foesWords = foes.map((f) => (f.count > 1 ? `${f.count} × ${f.name}` : f.name)).join(', ');
    if (!cr && foes.length) {
      const crs = foes.filter((f) => f.cr).map((f) => `CR ${f.cr}${f.count > 1 ? ' each' : ''}`);
      cr = foes.length === 1 ? crs[0] || '' : foes.map((f) => (f.cr ? `${f.name} CR ${f.cr}` : '')).filter(Boolean).join(', ');
    }
    return { place, foes: foesWords, cr };
  }

  const isMorten = (name) => /^morten\b/i.test(str(name));

  /** Morten's HP track row, or null. */
  function mortenTrack(f) {
    if (!f) return null;
    return f.hpTrack.find((t) => isMorten(t.name)) || null;
  }

  /** HP before and after for Morten: {before, after, max, low} from the track, else the section's after. */
  function mortenHp(sec) {
    const t = mortenTrack(sec.fight);
    const hp = t ? t.hp.filter(isNum) : [];
    const after = sec.after && isNum(sec.after.hp) ? sec.after.hp : hp.length ? hp[hp.length - 1] : null;
    const max = t && isNum(t.max) ? t.max : sec.after && isNum(sec.after.maxHp) ? sec.after.maxHp : null;
    return { before: hp.length ? hp[0] : null, after, max, low: hp.length ? Math.min(...hp) : after };
  }

  /** The outcome's word and colour; a clear that took Morten to half HP or less shows amber. */
  function outcomeOf(sec, live) {
    if (live) return OUTCOME.going;
    const f = sec.fight;
    const o = OUTCOME[f ? f.outcome : 'going'] || OUTCOME.going;
    if (o === OUTCOME.cleared) {
      const h = mortenHp(sec);
      if (isNum(h.low) && isNum(h.max) && h.max > 0 && h.low <= h.max / 2) return { word: o.word, cls: 'warn' };
    }
    return o;
  }

  const lostOf = (sec) => {
    const f = sec.fight;
    const a = f && f.lost.length ? f.lost : sec.after ? sec.after.lost : [];
    return arr(a);
  };

  /** "3 Giant Lizards" → the phrase; the place's icon. */
  const placeIcon = (place) => (/room|floor|hall|door/i.test(place) ? 'door' : /road|wander|travel|camp/i.test(place) ? 'boots' : 'fight');

  // ---------- the parts of a card ----------
  function foeRows(foes, live) {
    if (!foes.length) return '';
    return `<div class="foes" aria-label="The foes">${foes.map((f) => {
      const name = `${esc(f.name)}${f.count > 1 ? ` <span class="ct">×${esc(f.count)}</span>` : ''}`;
      let hp;
      if (!isNum(f.hp) && !isNum(f.maxHp) && f.state) hp = `<span class="${STATE_CLS[f.state] || ''}">${esc(cap(f.state))}</span>`;
      else if (live || !isNum(f.hp) || f.hp === f.maxHp || !isNum(f.maxHp)) {
        const v = isNum(f.maxHp) ? f.maxHp : f.hp;
        hp = isNum(v) ? `${esc(fmt.n(v))} HP${f.count > 1 ? ' each' : ''}` : '';
      } else hp = esc(fmt.hp(f.hp, f.maxHp));
      const stats = [f.cr ? `CR ${f.cr}` : '', fmt.ac(f.ac), f.speed, ...f.attacks, f.notes].filter(Boolean);
      return `<div class="foe"><b>${name}</b>${hp ? `<span class="hp">${icon('heart', 'bad')}${hp}</span>` : ''}${stats.length ? `<span class="stats">${stats.map(esc).join(' · ')}</span>` : ''}</div>`;
    }).join('')}</div>`;
  }

  /** The live HP bars: Morten and each foe from the newest beat's state. */
  function hpBars(state) {
    if (!state) return '';
    const rows = [];
    const m = state.morten;
    if (m && (isNum(m.hp) || isNum(m.maxHp))) rows.push({ name: 'Morten', hp: m.hp, max: m.maxHp, me: true });
    for (const f of arr(state.foes)) rows.push({ name: f.name, hp: f.hp, max: f.maxHp, state: f.state });
    if (!rows.length) return '';
    return `<div class="hprow" aria-label="HP now">${rows.map((r) => {
      if (!isNum(r.hp) && r.state) {
        return `<div class="hp${r.me ? ' me' : ''}"><span class="nm" title="${esc(r.name)}">${esc(shortName(r.name))}</span><span class="bar ${r.state === 'healthy' ? '' : r.state === 'bloodied' ? 'mid' : 'low'}" role="img" aria-label="${esc(r.state)}"><i style="width:${STATE_PCT[r.state] || 0}%"></i></span><b class="${STATE_CLS[r.state] || ''}">${esc(cap(r.state))}</b></div>`;
      }
      const down = isNum(r.hp) && r.hp <= 0;
      return `<div class="hp${r.me ? ' me' : ''}${down ? ' down' : ''}"><span class="nm" title="${esc(r.name)}">${esc(shortName(r.name))}</span>${bar(r.hp, r.max)}<b>${down && !r.me ? 'down' : esc(isNum(r.max) ? `${fmt.n(r.hp)}/${fmt.n(r.max)} HP` : fmt.hp(r.hp, r.max))}</b></div>`;
    }).join('')}</div>`;
  }

  /** A short name for a line's end label: "Giant Wolf Spider A" -> "Spider A". */
  function shortName(name) {
    const s = str(name);
    if (s.length <= 11) return s;
    const w = s.split(/\s+/);
    const last = w[w.length - 1];
    if (w.length > 1 && /^[A-Z0-9]$/.test(last)) {
      const pre = w[w.length - 2];
      return `${pre.length > 9 ? `${pre.slice(0, 8)}.` : pre} ${last}`;
    }
    return last.length <= 11 ? last : `${last.slice(0, 10)}.`;
  }

  const DASH = ['5 3', '2 3', '8 3 2 3', '1 3', '10 4', '4 2 1 2'];
  /**
   * The HP track (as Dream's panels/hp-track.ts): Morten and each foe from the start through
   * each round, an inline SVG line chart, each line named at its end, the numbers one tap
   * away. Morten is the brass line; foes are ink lines told apart by their dash and their
   * names. A foe's line ends where it went down (a red dot).
   */
  function hpTrack(f, key) {
    const list = f ? f.hpTrack.filter((t) => t.hp.some(isNum)) : [];
    if (!list.length) return '';
    const series = list.filter((t) => isMorten(t.name)).concat(list.filter((t) => !isMorten(t.name)));
    const W = 300; const H = 132; const L = 24; const R = 76; const TOP = 10; const B = 22;
    const n = Math.max(1, ...series.map((t) => t.hp.length)) - 1;
    const top = Math.max(1, ...series.map((t) => (isNum(t.max) ? t.max : 0)), ...series.flatMap((t) => t.hp.filter(isNum)));
    const x = (i) => (n === 0 ? L + (W - L - R) / 2 : L + (i / n) * (W - L - R));
    const y = (v) => TOP + (1 - v / top) * (H - TOP - B);
    const f1 = (v) => v.toFixed(1);
    let foeI = 0;
    const out = series.map((t) => {
      const me = isMorten(t.name);
      let hp = t.hp.slice();
      if (!me) {
        const z = hp.findIndex((v) => isNum(v) && v <= 0);
        if (z >= 0) hp = hp.slice(0, z + 1);
      }
      const pts = hp.map((v, i) => (isNum(v) ? { x: x(i), y: y(Math.max(0, v)), hp: v, i } : null));
      let d = '';
      let pen = false;
      for (const p of pts) {
        if (!p) { pen = false; continue; }
        d += `${pen ? 'L' : 'M'}${f1(p.x)},${f1(p.y)} `;
        pen = true;
      }
      const real = pts.filter(Boolean);
      const last = real[real.length - 1];
      const dead = !me && last.hp <= 0;
      const cls = me ? 'm' : `f f${foeI % 4}`;
      const dash = me ? '' : DASH[foeI % DASH.length];
      if (!me) foeI += 1;
      // a foe that went down: its line stops there (a red dot), a faint rule runs on at 0
      const gone = dead && last.i < n ? `M${f1(last.x)},${f1(last.y)} L${f1(x(n))},${f1(last.y)}` : '';
      return { t, me, cls, dash, pts: real, d: d.trim(), gone, last, dead, label: { x: x(n) + 6, y: last.y, text: `${shortName(t.name)} ${dead ? '✝' : last.hp <= 0 ? '0' : fmt.n(last.hp)}` } };
    });
    // end labels, all in the right gutter: pushed apart where two end close together,
    // then back up off the round ticks when several end low (as Dream's hp-track does)
    const labs = out.map((s) => s.label).sort((a, b) => a.y - b.y);
    for (let i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < 11) labs[i].y = labs[i - 1].y + 11;
    const floor = H - B;
    for (let i = labs.length - 1; i >= 0; i--) {
      const below = i === labs.length - 1 ? floor : labs[i + 1].y - 11;
      labs[i].y = Math.min(labs[i].y, below);
    }
    const half = Math.round(top / 2);
    const grid = [0, half, top].filter((v, i, a) => a.indexOf(v) === i);
    const every = n <= 10 ? 1 : Math.ceil(n / 8);
    const ticks = [{ i: 0, t: 'start' }];
    for (let i = every; i <= n; i += every) ticks.push({ i, t: `R${i}` });
    const when = (i) => (i === 0 ? 'at the start' : `after round ${i}`);
    const aria = `HP at the start and after each round: ${out.map((s) => `${s.t.name} ${s.pts.map((p) => p.hp).join(', ')}`).join('; ')}`;
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}" data-hp-tap="${esc(key)}">`
      + grid.map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${f1(y(v))}" y2="${f1(y(v))}"/><text class="tick" x="${L - 5}" y="${f1(y(v) + 3)}" text-anchor="end">${v}</text>`).join('')
      + ticks.map((k) => `<text class="tick" x="${f1(x(k.i))}" y="${H - 6}" text-anchor="middle">${k.t}</text>`).join('')
      + out.map((s) => (s.gone ? `<path class="gone" d="${s.gone}"/>` : '')).join('')
      + out.map((s) => `<path class="ln ${s.cls}" d="${s.d}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>`).join('')
      + out.map((s) => s.pts.map((p) => `<circle class="dot ${s.cls}${!s.me && p.hp <= 0 ? ' dead' : ''}" cx="${f1(p.x)}" cy="${f1(p.y)}" r="${!s.me && p.hp <= 0 ? 3.6 : n > 12 ? 1.8 : 2.6}"><title>${esc(s.t.name)}, ${when(p.i)}: ${esc(isNum(s.t.max) ? `${p.hp}/${s.t.max} HP` : `${p.hp} HP`)}</title></circle>`).join('')
        + `<text class="end ${s.cls}" x="${f1(s.label.x)}" y="${f1(s.label.y)}">${esc(s.label.text)}</text>`).join('')
      + '</svg>';
    const legend = out.length > 1
      ? `<span class="legend">${out.map((s) => `<span><svg viewBox="0 0 18 6" aria-hidden="true"><line class="ln ${s.cls}" x1="1" x2="17" y1="3" y2="3"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/></svg>${esc(s.t.name)}</span>`).join('')}</span>`
      : '';
    const cols = Array.from({ length: n + 1 }, (_, i) => (i === 0 ? 'start' : `R${i}`));
    const fold = `${key}:hp`;
    const table = `<details class="numbers" data-fold="${esc(fold)}"${opened.has(fold) ? ' open' : ''}><summary>${icon('chev')}The HP as numbers</summary>`
      + `<div class="scroll"><table><thead><tr><th scope="col"><span class="vh">who</span></th>${cols.map((c) => `<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>`
      + out.map((s) => `<tr><th scope="row" title="${esc(s.t.name)}">${esc(shortName(s.t.name))}${isNum(s.t.max) ? ` <small>of ${esc(s.t.max)}</small>` : ''}</th>${cols.map((_, i) => {
        const v = s.t.hp[i];
        return `<td class="${isNum(v) && v <= 0 ? 'zero' : ''}">${isNum(v) ? esc(v) : '·'}</td>`;
      }).join('')}</tr>`).join('')
      + '</tbody></table></div></details>';
    return `<figure class="track" aria-label="HP across the fight"><figcaption><span class="label">HP across the fight</span>${legend}</figcaption>${svg}${table}</figure>`;
  }

  /** Bold the HP a line reports after a hit ("Morten 20 → 15 HP", "A 27 → 17 HP") and a kill. */
  function lineText(text) {
    return esc(text)
      .replace(/((?:\b[A-Z][\w'’]*(?: [A-Z]\b)? )?\d+ → \d+ HP)/g, '<b>$1</b>')
      .replace(/\b(dead|down|killed)\b/g, '<b>$1</b>');
  }

  const MARK = { morten: '✦', foe: '›', gm: '·', world: '·' };
  function lineHtml(l) {
    const cls = l.who === 'foe' ? ' them' : l.who === 'morten' ? ' me' : ' gm';
    const fizz = arr(l.dice).some((d) => d && d.result === 'fizzle');
    const ds = dice(l.dice);
    return `<div class="ln${cls}${fizz ? ' fizzled' : ''}"><span class="mk" aria-hidden="true">${MARK[l.who] || '·'}</span><span class="tx">${lineText(l.text)}${fizz ? ' <span class="tag-fizz">fizzle</span>' : ''}${ds ? ` <span class="dice">${ds}</span>` : ''}</span></div>`;
  }

  /** Lines grouped into rounds; lines with no round join the round before (or "Before the fight"). */
  function group(lines) {
    const out = [];
    let cur = null;
    for (const l of lines) {
      const r = isNum(l.round) ? l.round : null;
      if (!cur || (r !== null && r !== cur.n)) {
        cur = { n: r, lines: [], texts: [] };
        out.push(cur);
      }
      cur.lines.push(l);
    }
    return out;
  }

  function roundsHtml(blocks, initiative) {
    return blocks.map((b) => {
      const init = b.n === 1 && initiative.length ? ` · init ${initiative.map(esc).join(' › ')}` : '';
      const h = b.n === null ? 'Before the fight' : `Round ${b.n}${init}`;
      return `<div class="round"><h5>${h}</h5>${b.texts.map((t) => `<p class="beat-tx">${esc(t)}</p>`).join('')}${b.lines.map(lineHtml).join('')}</div>`;
    }).join('');
  }

  function storyHtml(sec) {
    const parts = [];
    if (sec.headline) parts.push(`<p class="head">${esc(sec.headline)}</p>`);
    for (const p of arr(sec.prose)) parts.push(`<p>${esc(p)}</p>`);
    const bl = arr(sec.bullets).filter((b) => b && b.text);
    if (bl.length) parts.push(`<ul class="bullets">${bl.map((b) => `<li>${b.label ? `<b>${esc(b.label)}</b>` : ''}${esc(b.text)}</li>`).join('')}</ul>`);
    return parts.length ? `<div class="story">${parts.join('')}</div>` : '';
  }

  function resultHtml(sec) {
    const f = sec.fight;
    const bits = [];
    const xpAfter = f && isNum(f.xpAfter) ? f.xpAfter : sec.after ? sec.after.xp : null;
    const gained = f && isNum(f.xp) ? f.xp : f && isNum(f.xpBefore) && isNum(xpAfter) ? xpAfter - f.xpBefore : null;
    if (isNum(gained) || isNum(xpAfter)) bits.push(`<span>${icon('spark')}${isNum(gained) ? `+${esc(fmt.xp(gained))}` : 'XP'}${isNum(xpAfter) ? ` → <b>${esc(fmt.xp(xpAfter))}</b>` : ''}</span>`);
    if (f && f.loot) bits.push(`<span>${icon('coins')}${esc(f.loot)}</span>`);
    const h = mortenHp(sec);
    if (isNum(h.after)) bits.push(`<span>${icon('heart')}<b>${esc(isNum(h.max) ? `${fmt.n(h.after)}/${fmt.n(h.max)} HP` : fmt.hp(h.after))}</b></span>`);
    const lost = lostOf(sec);
    bits.push(lost.length ? `<span class="lost">lost <b>${esc(lost.join(', '))}</b> until a Long Rest</span>` : '<span>nothing lost</span>');
    if (f && f.potion) bits.push('<span class="warn">a potion used</span>');
    return `<p class="result">${bits.join('')}</p>`;
  }

  // ---------- the card ----------
  function html(section, opts = {}) {
    const o = opts || {};
    const sec = section && typeof section === 'object' ? section : {};
    const beats = arr(o.beats).filter((b) => b && typeof b === 'object');
    const live = !!o.live;
    const scope = str(o.scope);
    const id = str(sec.id) || (beats.length ? `live-${str(sec.title) || 'fight'}` : 'fight');
    const key = `${scope}${id}`;
    const f = sec.fight && typeof sec.fight === 'object' ? sec.fight : null;
    // the foes: the fight's, else the section head's, else the beats' head
    let foes = f ? arr(f.foes) : arr(sec.foes);
    if (!foes.length) for (const b of beats) if (b.section && arr(b.section.foes).length) foes = b.section.foes;
    const hd = head(sec.title || !beats.length ? sec : Object.assign({}, sec, { title: beats[beats.length - 1].section ? beats[beats.length - 1].section.title : '' }), foes);
    const out = outcomeOf(sec, live);
    const lastBeat = beats[beats.length - 1] || null;
    const round = live ? (lastBeat && isNum(lastBeat.round) ? lastBeat.round : null) : f && isNum(f.rounds) ? f.rounds : null;

    const meta = [];
    if (f && (f.difficulty || isNum(f.xp))) meta.push(`<span>${esc([f.difficulty, fmt.xp(f.xp)].filter(Boolean).join(', '))}</span>`);
    if (live) meta.push(`<span class="live-tag"><i class="pulse" aria-hidden="true"></i>in progress${isNum(round) ? ` · round ${esc(round)}` : ''}</span>`);
    else {
      meta.push(`<span class="out ${out.cls}">${esc(out.word)}</span>`);
      if (isNum(round)) meta.push(`<span>${esc(fmt.plural(round, 'round'))}</span>`);
      if (f && f.verdict && f.verdict !== out.word) meta.push(`<span class="verdict">${esc(f.verdict)}</span>`);
    }
    const when = !live && (isNum(sec.month) || isNum(sec.day)) ? fmt.when({ month: sec.month, day: sec.day, clock: sec.clock }) : '';
    const title = `${esc(hd.place)}${hd.place && hd.foes ? ' · ' : ''}${esc(hd.foes)}${hd.cr ? ` <small>${esc(hd.cr)}</small>` : ''}`;

    const parts = [];
    parts.push(`<div class="sec-head">${icon(placeIcon(hd.place))}<div><h3>${title || 'A fight'}</h3><p class="meta">${meta.join('')}</p>${when ? `<p class="meta when">${esc(when)}${sec.where && sec.where !== hd.place ? ` · ${esc(sec.where)}` : ''}</p>` : ''}</div></div>`);
    parts.push(foeRows(foes, live));

    if (live) {
      parts.push(hpBars(lastBeat ? lastBeat.state : null));
      const lines = [];
      const texts = new Map();
      for (const b of beats) {
        for (const l of arr(b.lines)) lines.push(isNum(l.round) || !isNum(b.round) ? l : Object.assign({}, l, { round: b.round }));
        if (b.text) {
          const r = isNum(b.round) ? b.round : null;
          if (!texts.has(r)) texts.set(r, []);
          texts.get(r).push(b.text);
        }
      }
      // live lines are merged by round (beats may split one round)
      const blocks = [];
      for (const l of lines) {
        const r = isNum(l.round) ? l.round : null;
        let blk = blocks.find((x) => x.n === r);
        if (!blk) { blk = { n: r, lines: [], texts: [] }; blocks.push(blk); }
        blk.lines.push(l);
      }
      for (const [r, t] of texts) {
        let blk = blocks.find((b) => b.n === r);
        if (!blk) { blk = { n: r, lines: [], texts: [] }; blocks.push(blk); }
        blk.texts.push(...t);
      }
      blocks.sort((a, b) => (a.n === null ? -1 : b.n === null ? 1 : a.n - b.n));
      parts.push(blocks.length ? `<div class="rounds">${roundsHtml(blocks, f ? f.initiative : [])}</div>` : '<p class="muted waiting">The first round is being rolled.</p>');
    } else {
      parts.push(hpTrack(f, key));
      parts.push(storyHtml(sec));
      const blocks = group(arr(sec.trace));
      if (blocks.length) {
        const fold = `${key}:rounds`;
        const nRounds = blocks.filter((b) => b.n !== null).length;
        parts.push(`<details class="trace" data-fold="${esc(fold)}"${opened.has(fold) ? ' open' : ''}><summary>${icon('chev')}The rounds and the dice${nRounds ? ` (${esc(fmt.plural(nRounds, 'round'))})` : ''}</summary>${roundsHtml(blocks, f ? f.initiative : [])}</details>`);
      }
      parts.push(resultHtml(sec));
    }
    const label = `${live ? 'A fight going on' : 'A fight'}: ${hd.foes || hd.place}`;
    return `<article class="sec fight fcard${live ? ' live' : ''}" data-fight="${esc(key)}" aria-label="${esc(label)}">${parts.filter(Boolean).join('')}</article>`;
  }

  function bind(root) {
    if (!root || root.__fightBound) return;
    root.__fightBound = true;
    root.addEventListener('toggle', (ev) => {
      const d = ev.target;
      if (!d || !d.matches || !d.matches('details[data-fold]')) return;
      const k = d.getAttribute('data-fold');
      if (d.open) opened.add(k); else opened.delete(k);
    }, true);
    root.addEventListener('click', (ev) => {
      const s = ev.target && ev.target.closest ? ev.target.closest('svg[data-hp-tap]') : null;
      if (!s || !root.contains(s)) return;
      const fig = s.closest('figure');
      const d = fig && fig.querySelector('details.numbers');
      if (d) d.open = !d.open;
    });
  }

  T.panels.fightCard = { html, bind };

  // ---------- the Fights tab ----------
  let box = null;
  let month = 'all';
  const rowsOpen = new Set();

  /** The live fight, when one is going on: {section, beats}. */
  function liveFight(view) {
    const all = view.beats.filter((b) => b.section && b.section.kind === 'fight');
    // the newest fight's beats only (an older fight's beats are gone once it settles)
    const newest = all.length ? all[all.length - 1].section.title : '';
    const beats = all.filter((b) => b.section.title === newest);
    const head = view.state && view.state.live && view.state.live.kind === 'fight' ? view.state.live : null;
    if (!beats.length && !head) return null;
    const last = beats[beats.length - 1];
    const sec = Object.assign({ id: 'live' }, head || {}, last && last.section ? last.section : {});
    if (!isNum(sec.month) && head) sec.month = head.month;
    return { section: Object.assign({}, sec, { id: 'live', seq: last ? last.seq : Infinity }), beats };
  }

  function rowHtml(sec, live) {
    const f = sec.fight;
    const foes = f ? f.foes : arr(sec.foes);
    const hd = head(sec, foes);
    const out = outcomeOf(sec, live);
    let pip = out.cls === 'good' ? '' : out.cls === 'warn' ? 'hurt' : out.cls === 'bad' ? 'dead' : out.cls === 'brass' ? 'going' : 'off';
    if (live) pip = 'going';
    let hpWords = '';
    if (live) {
      const st = live.beats.length ? live.beats[live.beats.length - 1].state : null;
      const m = st && st.morten;
      if (m && isNum(m.hp)) hpWords = `${fmt.n(m.hp)}/${fmt.n(m.maxHp)} HP now`;
    } else {
      const h = mortenHp(sec);
      if (isNum(h.before) && isNum(h.after)) hpWords = h.before === h.after && h.low === h.before && (!isNum(h.max) || h.before === h.max) ? 'untouched' : `HP ${fmt.n(h.before)} → ${fmt.n(h.after)}`;
      else if (isNum(h.after)) hpWords = `HP ${fmt.hp(h.after, h.max)}`;
    }
    const m = [];
    const when = fmt.when({ month: sec.month, day: sec.day });
    if (when) m.push(when);
    if (f && (f.difficulty || isNum(f.xp))) m.push([f.difficulty, fmt.xp(f.xp)].filter(Boolean).join(', '));
    const lost = live ? [] : lostOf(sec);
    if (lost.length) m.push(`lost ${lost.join(', ')}`);
    if (f && f.potion) m.push('potion used');
    if (f && f.verdict && f.verdict !== out.word) m.push(f.verdict);
    const id = live ? 'live' : sec.id;
    const isOpen = rowsOpen.has(id);
    const title = `${esc(hd.place)}${hd.place && hd.foes ? ' · ' : ''}${esc(hd.foes)}${hd.cr ? ` <small class="muted">${esc(hd.cr)}</small>` : ''}`;
    const row = `<button type="button" class="frow" data-frow="${esc(id)}" aria-expanded="${isOpen}"><i class="pip ${pip}" aria-hidden="true"></i><span class="t">${title || 'A fight'}</span><span class="r"><span class="${out.cls}">${esc(out.word)}</span><br>${esc(hpWords)}</span><span class="m">${esc(m.join(' · '))}</span></button>`;
    const card = isOpen ? T.panels.fightCard.html(sec, { live: !!live, beats: live ? live.beats : [], scope: 'fights:' }) : '';
    return `<div class="fitem${isOpen ? ' open' : ''}">${row}${card}</div>`;
  }

  function render(view) {
    if (!box) return;
    const settled = view.sections.filter((s) => s.kind === 'fight' || s.fight).slice().sort((a, b) => b.seq - a.seq);
    const lf = liveFight(view);
    const all = (lf ? [{ sec: lf.section, live: lf }] : []).concat(settled.map((s) => ({ sec: s, live: null })));
    const months = [...new Set(all.map((x) => x.sec.month).filter(isNum))].sort((a, b) => b - a);
    if (month !== 'all' && !months.includes(month)) month = 'all';
    const shown = all.filter((x) => month === 'all' || x.sec.month === month);
    let body;
    if (!view.loaded.story && !all.length) body = '<p class="muted">Opening the story…</p>';
    else if (!all.length) body = '<p class="muted empty">No fight yet. Each fight lands here as a row: where it was, the foes with their CR, how hard it was, how it ended and what it cost; a row opens the fight\'s card.</p>';
    else {
      const filter = months.length > 1
        ? `<div class="subtabs" role="group" aria-label="Which month">${['all', ...months].map((mo) => `<button type="button" data-fmonth="${mo}" aria-pressed="${month === mo}">${mo === 'all' ? 'all' : `month ${mo}`}</button>`).join('')}</div>`
        : '';
      body = `${filter}<div class="frows">${shown.map((x) => rowHtml(x.sec, x.live)).join('')}</div><p class="muted hint">A row opens the fight's card as the story shows it: the foes, the HP track, the GM's summary and the rounds with their dice.</p>`;
    }
    const count = all.length;
    const sub = count ? `${esc(fmt.plural(count, 'fight'))} · newest first` : '';
    put(box, `<div class="card fights">${'<h3>'}${icon('fight')}Every fight${sub ? ` <small>${sub}</small>` : ''}</h3>${body}</div>`);
    T.panels.fightCard.bind(box);
  }

  T.panels.fights = {
    mount(el) {
      box = el;
      el.addEventListener('click', (ev) => {
        const t = ev.target && ev.target.closest ? ev.target : null;
        if (!t) return;
        const mb = t.closest('[data-fmonth]');
        if (mb) {
          const v = mb.getAttribute('data-fmonth');
          month = v === 'all' ? 'all' : parseInt(v, 10);
          if (T.app && T.app.render) T.app.render();
          return;
        }
        const rb = t.closest('[data-frow]');
        if (rb) {
          const id = rb.getAttribute('data-frow');
          if (rowsOpen.has(id)) rowsOpen.delete(id); else rowsOpen.add(id);
          if (T.app && T.app.render) T.app.render();
        }
      });
    },
    render,
  };
})();
/* ---- js/62-morten.js ---- */
// The Morten tab (#morten; table-plan.md 4.3): the sheet from game/morten, with what is
// true now (HP, AC, light, concentration, lost spells, coins) from game/state.hud when it
// is there. Cards: the HUD, Spells (tap one for its line), Fighting, Gear, Progress and
// Habits. UI state kept across renders: the spell picked, the open folds.
(() => {
  'use strict';
  const T = window.T;
  const { esc, icon, put, fmt, bar } = T.ui;
  const isNum = (v) => typeof v === 'number' && Number.isFinite(v);
  const arr = (v) => (Array.isArray(v) ? v : []);

  let box = null;
  let picked = null; // the spell (or feature) whose line shows: 'spell:Name' | 'feat:Name'
  const opened = new Set();

  /** The value now: game/state.hud's when it has one, else the sheet's. */
  function now(view) {
    const m = view.morten || {};
    const h = view.state && view.state.hud && view.state.hud.known ? view.state.hud : null;
    const pick = (k) => (h && h[k] !== null && h[k] !== undefined && h[k] !== '' ? h[k] : m[k] !== undefined ? m[k] : null);
    const coins = h && h.coins ? h.coins : m.coins ? m.coins.on : '';
    const lost = new Set([...(h ? h.lost : []), ...arr(m.spells).filter((s) => s.lost).map((s) => s.name)]);
    return {
      hp: pick('hp'), maxHp: pick('maxHp'), ac: pick('ac'), acArmor: pick('acArmor'), armorOn: pick('armorOn'),
      light: pick('light') || '', conc: pick('conc'), conditions: h && h.conditions.length ? h.conditions : arr(m.conditions),
      exhaustion: Math.max(h ? h.exhaustion : 0, m.exhaustion || 0), reaction: pick('reaction'),
      inspiration: pick('inspiration'), freeArmor: pick('freeArmor'), coins, lost,
    };
  }

  const signed = (v) => (isNum(v) ? fmt.signed(v) : '');
  /** "lamp, about 1 h of oil left" -> ["lamp", "about 1 h of oil left"]. */
  function split(s) {
    const t = typeof s === 'string' ? s.trim() : '';
    const i = t.indexOf(',');
    if (i > 0 && i <= 18) return [t.slice(0, i), t.slice(i + 1).trim()];
    return t.length <= 14 ? [t, ''] : ['', t];
  }
  /** "6 sq (9 m)" -> ["9 m", "6 sq"]. */
  function speedParts(s) {
    const m = /^(.*?)\s*\(([^)]*)\)\s*(.*)$/.exec(typeof s === 'string' ? s : '');
    return m ? [m[2], [m[1], m[3]].filter(Boolean).join(' ')] : [s || '', ''];
  }

  function glyph(on, iconName, onText, offText) {
    if (on === null || on === undefined) return '';
    return `<span class="chip glyph ${on ? 'lit' : 'spent'}">${icon(iconName)}<span>${esc(on ? onText : offText)}</span></span>`;
  }

  // ---------- the HUD ----------
  function hudCard(view, m, n) {
    const who = [m.species, m.class, m.background].filter(Boolean).join(' · ');
    const hpOk = isNum(n.hp);
    const stats = [];
    if (isNum(n.ac)) {
      const sub = n.armorOn === true ? 'Mage Armor holds' : isNum(n.acArmor) && n.acArmor !== n.ac ? `with Mage Armor ${fmt.n(n.acArmor)}` : '';
      stats.push(`<div class="stat"><span class="v">${icon('shield')}${esc(fmt.n(n.ac))}</span><span class="label">AC</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</div>`);
    }
    if (m.hitDice) {
      const [hv, hs] = m.hitDice.split(/\s+(?=d\d)/);
      stats.push(`<div class="stat"><span class="v">${icon('d20')}${esc(hv)}</span><span class="label">Hit Dice</span>${hs ? `<span class="sub">${esc(hs)} each</span>` : ''}</div>`);
    }
    if (n.light) {
      const [lv, ls] = split(n.light);
      stats.push(`<div class="stat"><span class="v">${icon('lantern')}${esc(lv || 'lit')}</span><span class="label">Light</span>${ls ? `<span class="sub">${esc(ls)}</span>` : ''}</div>`);
    } else if (view.state && view.state.hud && view.state.hud.known) {
      stats.push(`<div class="stat"><span class="v">${icon('lantern')}none</span><span class="label">Light</span></div>`);
    }
    if (m.speed) {
      const [sv, ss] = speedParts(m.speed);
      stats.push(`<div class="stat"><span class="v">${icon('boots')}${esc(sv)}</span><span class="label">Speed</span>${ss ? `<span class="sub">${esc(ss)}</span>` : ''}</div>`);
    }
    const chips = [];
    chips.push(n.conc ? `<span class="chip open"><span class="k">conc.</span>${esc(n.conc)}</span>` : '<span class="chip quiet">no concentration</span>');
    if (n.conditions.length) for (const c of n.conditions) chips.push(`<span class="chip threat"><span class="k">condition</span>${esc(c)}</span>`);
    else chips.push('<span class="chip quiet">no conditions</span>');
    chips.push(n.exhaustion > 0 ? `<span class="chip threat">exhaustion ${esc(n.exhaustion)}</span>` : '<span class="chip quiet">exhaustion 0</span>');
    chips.push(glyph(n.reaction, 'hand', 'reaction free', 'reaction used'));
    chips.push(glyph(n.inspiration, 'spark', 'Heroic Inspiration ready', 'Heroic Inspiration spent'));
    chips.push(glyph(n.freeArmor, 'shield', 'free Mage Armor ready', 'free Mage Armor used'));
    if (n.coins) chips.push(`<span class="chip">${icon('coins')}<span>${esc(n.coins)} on him</span></span>`);
    return `<div class="card mhud">`
      + `<h3>${icon('hat')}${esc(m.name || 'Morten')}${who ? ` <small>${esc(who)}</small>` : ''}</h3>`
      + `<div class="hpbig">${icon('heart')}${bar(n.hp, n.maxHp)}<b>${hpOk ? esc(isNum(n.maxHp) ? `${fmt.n(n.hp)} / ${fmt.n(n.maxHp)} HP` : fmt.hp(n.hp)) : '? HP'}</b></div>`
      + (stats.length ? `<div class="stat-row">${stats.join('')}</div>` : '')
      + `<div class="chips">${chips.filter(Boolean).join('')}</div>`
      + '</div>';
  }

  // ---------- spells ----------
  function spellChip(s, n, freeArmor) {
    const lost = n.lost.has(s.name);
    const free = !lost && freeArmor === true && /^mage armor$/i.test(s.name);
    const bits = [];
    if (s.level > 0) bits.push(`L${s.level}`);
    if (isNum(s.dc)) bits.push(`DC ${fmt.n(s.dc)}`);
    if (s.conc) bits.push('conc.');
    if (s.ritual) bits.push('ritual');
    if (free) bits.push('free once a day');
    const cls = ['spell', lost ? 'lost' : '', s.conc ? 'conc' : '', s.ritual ? 'ritual' : '', free ? 'free' : ''].filter(Boolean).join(' ');
    const key = `spell:${s.name}`;
    return `<button type="button" class="${cls}" data-pick="${esc(key)}" aria-pressed="${picked === key}"${lost ? ` aria-label="${esc(`${s.name}, lost, back after a Long Rest`)}"` : ''}>`
      + `<span class="nm">${esc(s.name)}</span>${bits.length ? `<small>${esc(bits.join(' · '))}</small>` : ''}`
      + (lost ? '<small class="back">back after a Long Rest</small>' : '')
      + '</button>';
  }

  function lineBox(title, sub, text, lost) {
    return `<div class="sline" role="note"><b>${esc(title)}</b>${sub ? ` <small>${esc(sub)}</small>` : ''}${text ? `<p>${esc(text)}</p>` : ''}${lost ? '<p class="bad">Lost: back after a Long Rest.</p>' : ''}</div>`;
  }

  function group(label, list, m, n) {
    if (!list.length) return '';
    const pickedHere = list.find((s) => picked === `spell:${s.name}`);
    let line = '';
    if (pickedHere) {
      const s = pickedHere;
      const sub = [s.level ? `level ${s.level}` : 'cantrip', isNum(s.dc) ? `cast DC ${s.dc}` : '', s.time, s.range, s.conc ? 'concentration' : '', s.ritual ? 'ritual' : '', s.note].filter(Boolean).join(' · ');
      line = lineBox(s.name, sub, s.line, n.lost.has(s.name));
    }
    return `<span class="label">${label}</span><div class="spells">${list.map((s) => spellChip(s, n, n.freeArmor)).join('')}</div>${line}`;
  }

  function spellsCard(m, n) {
    const spells = arr(m.spells);
    const feats = arr(m.features);
    const ar = feats.find((f) => /arcane recovery/i.test(f.name));
    if (!spells.length && !ar) return '';
    const cantrips = spells.filter((s) => s.level === 0 && s.prepared);
    const prepared = spells.filter((s) => s.level > 0 && s.prepared);
    const book = spells.filter((s) => !s.prepared);
    const sub = [isNum(m.spellAttack) ? `cast d20 ${fmt.signed(m.spellAttack)} vs DC 10 + level` : '', isNum(m.saveDc) ? `save DC ${m.saveDc}` : ''].filter(Boolean).join(' · ');
    let arHtml = '';
    if (ar) {
      const ready = /ready|unused|free/i.test(ar.state);
      const key = `feat:${ar.name}`;
      arHtml = `<div class="arow"><button type="button" class="chip glyph arc ${ready ? 'lit' : 'spent'}" data-pick="${esc(key)}" aria-pressed="${picked === key}">${icon('spark')}<span>${esc(ar.name)} ${ready ? 'ready' : esc(ar.state || 'used')}</span></button></div>`
        + (picked === key ? lineBox(ar.name, ar.state, ar.line, false) : '');
    }
    const lostN = spells.filter((s) => n.lost.has(s.name)).length;
    return `<div class="card mspells">`
      + `<h3>${icon('spark')}Spells${sub ? ` <small>${esc(sub)}</small>` : ''}</h3>`
      + group(`Cantrips${cantrips[0] && isNum(cantrips[0].dc) ? ` · DC ${esc(cantrips[0].dc)}` : ''}`, cantrips, m, n)
      + group(`Prepared${lostN ? ` · ${esc(fmt.plural(lostN, 'spell'))} lost, back after a Long Rest` : ' · a lost one comes back after a Long Rest'}`, prepared, m, n)
      + group('In the book, not prepared · rituals need no roll', book, m, n)
      + arHtml
      + '<p class="muted hint">Tap a spell for its one line.</p>'
      + '</div>';
  }

  // ---------- fighting ----------
  function fightingCard(m) {
    const atk = arr(m.attacks);
    const ab = arr(m.abilities);
    const sk = arr(m.skills);
    if (!atk.length && !ab.length && !sk.length) return '';
    const stats = [];
    const add = (v, label, sub) => { if (v !== '' && v !== null && v !== undefined) stats.push(`<div class="stat"><span class="v">${esc(v)}</span><span class="label">${label}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</div>`); };
    add(m.initiative, 'Initiative');
    add(isNum(m.passivePerception) ? m.passivePerception : '', 'Passive Perc.');
    const [sv, ss] = speedParts(m.speed);
    add(sv, 'Speed', ss);
    add(isNum(m.spellAttack) ? fmt.signed(m.spellAttack) : '', 'Spell attack');
    add(isNum(m.saveDc) ? m.saveDc : '', 'Save DC');
    add(isNum(m.prof) ? fmt.signed(m.prof) : '', 'Proficiency');
    return `<div class="card mfight">`
      + `<h3>${icon('sword')}Fighting</h3>`
      + (atk.length ? `<div class="atks" role="table" aria-label="Attacks"><div class="atk head" role="row"><span role="columnheader">Attack</span><span role="columnheader">To hit</span><span role="columnheader">Damage · range</span></div>${atk.map((a) => `<div class="atk" role="row"><b role="cell">${esc(a.name)}</b><span class="hit" role="cell">${esc(a.hit)}</span><span class="dmg" role="cell">${esc([a.damage, a.range].filter(Boolean).join(' · '))}</span></div>`).join('')}</div>` : '')
      + (ab.length ? `<span class="label">Abilities and saves</span><div class="stat-row abil">${ab.map((a) => `<div class="stat${a.saveProf ? ' prof' : ''}"><span class="v">${esc(fmt.n(a.score))} <small class="muted">${esc(signed(a.mod))}</small></span><span class="label">${esc(a.key)}</span>${isNum(a.save) ? `<span class="sub">save ${esc(fmt.signed(a.save))}${a.saveProf ? ' ✦' : ''}</span>` : ''}</div>`).join('')}</div>` : '')
      + (sk.length ? `<span class="label">Skills</span><div class="chips skills">${sk.map((s) => `<span class="chip">${esc(s.name)} <b class="num">${esc(signed(s.mod))}</b></span>`).join('')}</div>` : '')
      + (stats.length ? `<div class="stat-row">${stats.join('')}</div>` : '')
      + '</div>';
  }

  // ---------- gear ----------
  function pips(count) {
    if (!isNum(count) || count < 2 || count > 12) return '';
    return `<span class="pips" aria-hidden="true">${'<i></i>'.repeat(count)}</span>`;
  }
  const kg = (v) => (isNum(v) ? `${fmt.n(Math.round(v * 100) / 100)} kg` : '');

  function gearCard(m) {
    const gear = arr(m.gear);
    const load = m.load;
    const coins = m.coins || { on: '', purse: '' };
    const trader = arr(m.trader);
    if (!gear.length && !load && !coins.on && !trader.length) return '';
    let loadHtml = '';
    if (load && isNum(load.kg) && isNum(load.max) && load.max > 0) {
      const r = load.kg / load.max;
      const pct = Math.max(0, Math.min(100, Math.round(r * 100)));
      loadHtml = `<div class="load"><span class="label">Load</span><span class="bar load-bar ${r > 1 ? 'low' : r > 0.75 ? 'mid' : ''}" role="img" aria-label="${esc(`${fmt.n(load.kg)} of ${fmt.n(load.max)} kg`)}"><i style="width:${pct}%"></i></span><b>${esc(`${fmt.n(load.kg)} of ${fmt.n(load.max)} kg`)}</b></div>`;
    }
    const rows = gear.map((g) => {
      const total = isNum(g.kg) ? (isNum(g.count) ? g.kg * g.count : g.kg) : null;
      const ct = isNum(g.count) && g.count !== 1 ? `×${fmt.n(g.count)}` : g.count === 0 ? 'none left' : '';
      return `<span class="nm${g.count === 0 ? ' none' : ''}">${esc(g.name)} ${pips(g.count)}${g.note ? `<small>${esc(g.note)}</small>` : ''}</span><span class="kg">${esc(total === null ? '—' : kg(total))}</span><span class="ct">${esc(ct)}</span>`;
    }).join('');
    const coinRows = [];
    if (coins.on) coinRows.push(`<span class="nm">On him <small>lost if he dies</small></span><span class="kg"></span><span class="ct">${esc(coins.on)}</span>`);
    if (coins.purse) coinRows.push(`<span class="nm">The purse in the tower</span><span class="kg"></span><span class="ct">${esc(coins.purse)}</span>`);
    const sub = load && isNum(load.kg) && isNum(load.max) ? `${fmt.n(load.kg)} of ${fmt.n(load.max)} kg` : '';
    return `<div class="card mgear">`
      + `<h3>${icon('bag')}Gear${sub ? ` <small>${esc(sub)}</small>` : ''}</h3>`
      + loadHtml
      + (gear.length ? `<div class="inv">${rows}</div>` : '')
      + (coinRows.length ? `<div class="inv"><span class="label">${icon('coins')} Coins</span>${coinRows.join('')}</div>` : '')
      + (trader.length ? `<div class="inv trader"><span class="label">${icon('cart')} The trader, while he is home</span>${trader.map((t) => `<span class="nm">${esc(t.name)}</span><span class="kg"></span><span class="ct">${esc(t.price)}</span>`).join('')}</div>` : '')
      + '</div>';
  }

  // ---------- progress and habits ----------
  function progressCard(m, view) {
    const xp = isNum(m.xp) ? m.xp : view.state ? view.state.xp : null;
    const next = m.nextXp;
    const level = isNum(m.level) ? m.level : view.state ? view.state.level : null;
    if (!isNum(xp) && !isNum(level)) return '';
    const pct = isNum(xp) && isNum(next) && next > 0 ? Math.max(0, Math.min(100, Math.round((xp / next) * 100))) : 0;
    const chips = [];
    if (isNum(level)) chips.push(`<span class="chip">level ${esc(level)}</span>`);
    if (isNum(xp) && isNum(next) && next > xp && isNum(level)) chips.push(`<span class="chip">level ${esc(level + 1)} in ${esc(fmt.xp(next - xp))}</span>`);
    chips.push(`<span class="chip">${icon('skull')}<span>${esc(fmt.plural(m.deaths || 0, 'death'))}</span></span>`);
    chips.push(m.familiar ? `<span class="chip"><span class="k">familiar</span>${esc(m.familiar)}</span>` : '<span class="chip quiet">no familiar</span>');
    return `<div class="card mprog">`
      + `<h3>${icon('flag')}Progress</h3>`
      + (isNum(xp) ? `<div class="hpbig xp">${icon('spark')}<span class="bar xp-bar" role="img" aria-label="${esc(`${fmt.n(xp)} of ${fmt.n(next)} XP`)}"><i style="width:${pct}%"></i></span><b>${esc(isNum(next) ? `${fmt.n(xp)} of ${fmt.n(next)} XP` : fmt.xp(xp))}</b></div>` : '')
      + `<div class="chips">${chips.join('')}</div>`
      + '</div>';
  }

  function habitsCard(m, view) {
    const habits = m.habits && m.habits.length ? m.habits : view.state ? view.state.table.habits : [];
    return `<div class="card mhabits">`
      + `<h3>${icon('book')}Habits <small>his standing orders</small></h3>`
      + (habits.length ? `<ul class="bullets">${habits.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : '<p class="muted">None set yet.</p>')
      + '<button type="button" class="toggle" data-go="table">Change them on the Table tab</button>'
      + '</div>';
  }

  function featuresCard(m) {
    const feats = arr(m.features).filter((f) => !/arcane recovery/i.test(f.name));
    if (!feats.length) return '';
    const k = 'features';
    return `<details class="card mfeat" data-mfold="${k}"${opened.has(k) ? ' open' : ''}><summary>${icon('chev')}<span>Features</span> <small>${esc(fmt.plural(feats.length, 'feature'))}</small></summary>`
      + feats.map((f) => `<div class="feat">${icon('spark')}<span><b>${esc(f.name)}</b> ${esc(f.line)}</span><span class="st">${esc(f.state === 'always' ? '' : f.state)}</span></div>`).join('')
      + '</details>';
  }

  function render(view) {
    if (!box) return;
    const m = view.morten;
    if (!m) {
      put(box, `<div class="card"><h3>${icon('hat')}Morten</h3><p class="muted">${view.loaded.morten || view.db !== 'ok' ? 'No sheet yet: it arrives with the GM\'s first write to the table.' : 'Opening his sheet…'}</p></div>`);
      return;
    }
    const n = now(view);
    put(box, hudCard(view, m, n) + spellsCard(m, n) + fightingCard(m) + gearCard(m) + progressCard(m, view) + habitsCard(m, view) + featuresCard(m));
  }

  T.panels.morten = {
    mount(el) {
      box = el;
      el.addEventListener('click', (ev) => {
        const t = ev.target && ev.target.closest ? ev.target : null;
        if (!t) return;
        const p = t.closest('[data-pick]');
        if (p) {
          const k = p.getAttribute('data-pick');
          picked = picked === k ? null : k;
          if (T.app && T.app.render) T.app.render();
          return;
        }
        const g = t.closest('[data-go]');
        if (g && T.app && T.app.go) T.app.go(g.getAttribute('data-go'));
      });
      el.addEventListener('toggle', (ev) => {
        const d = ev.target;
        if (!d || !d.matches || !d.matches('details[data-mfold]')) return;
        const k = d.getAttribute('data-mfold');
        if (d.open) opened.add(k); else opened.delete(k);
      }, true);
    },
    render,
  };
})();
/* ---- js/70-realm.js ---- */
// The Realm tab (table-plan.md 3.1-3.4, 4.4): the tower card, the map, the hex entry and
// the realm rows, from game/realm (map.json as the engine writes it, plus the page's
// camelCase words, kinds, rumours, floors, days, eventsWords, hexNames) and game/state.
// UI state (the picked hex, the open rows, the map's toggles, the event shown) lives in
// this closure and survives re-renders; Codes and Moves are remembered per viewer.
(() => {
  'use strict';
  const T = window.T;
  const { esc, fmt, put, icon, bar, band, fac, note, local } = T.ui;

  // ---------- words ----------
  const ATTR = { F: ['sword', 'Force'], C: ['mask', 'Cunning'], W: ['coins', 'Wealth'] };
  const typeOf = (a, k) => {
    const t = (k && k.type) || (a && a.type) || '';
    const c = t.charAt(0).toUpperCase();
    return ATTR[c] ? c : 'F';
  };
  const DIFF = ['Low', 'Moderate', 'High'];
  const isTower = (n) => n === 'tower' || n === 'the tower';
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : '');
  /** "the Orcs" / "the tower" */
  const the = (n) => (isTower(n) ? 'the tower' : n ? `the ${n}` : 'nobody');
  /** "the Orcs'" / "the Goblinkind's" / "the tower's" */
  const poss = (n) => (isTower(n) ? "the tower's" : !n ? "nobody's" : /s$/.test(n) ? `the ${n}'` : `the ${n}'s`);
  const plural = (n, one, many) => `${fmt.n(n)} ${n === 1 ? one : many || `${one}s`}`;
  const days = (d) => plural(d, 'day');
  /** The engine's asset ids ("Caravans a8") are not for the reader. */
  const noIds = (s) => String(s || '').replace(/\s+a\d+\b/g, '');
  const L = { F: 'Force', C: 'Cunning', W: 'Wealth' };
  /** "F vs F, 1d6" -> "hits with Force against Force for 1d6" (when kinds lacks the words). */
  function attackWords(att) {
    const m = /^\s*([FCW])\s*vs\s*([FCW])\s*,\s*(.+)$/i.exec(att || '');
    if (!m) return att ? `attacks: ${att}` : "doesn't attack";
    return `hits with ${L[m[1].toUpperCase()]} against ${L[m[2].toUpperCase()]} for ${m[3]}`;
  }

  // ---------- geometry (flat-top hexes, the mockup's) ----------
  const S = 58;
  const HH = (Math.sqrt(3) / 2) * S;
  const PAD = 10;
  const f1 = (n) => (Math.round(n * 10) / 10).toString();
  const corners = (x, y, s = S) => [0, 1, 2, 3, 4, 5].map((i) => [x + s * Math.cos((Math.PI / 3) * i), y + s * Math.sin((Math.PI / 3) * i)]);
  const pts = (x, y, s = S) => corners(x, y, s).map((p) => `${f1(p[0])},${f1(p[1])}`).join(' ');

  // ---------- the model: what every part reads, built once per realm doc and origin ----------
  let memo = { realm: null, origin: null, state: null, m: null };
  function model(realm, state) {
    const origin = (state && state.hex) || (realm.morten && realm.morten.hex) || '';
    if (memo.realm === realm && memo.origin === origin && memo.state === state) return memo.m;
    const byId = new Map(realm.hexes.map((h) => [h.id, h]));
    const facs = new Map(realm.factions.map((f) => [f.name, f]));
    const lay = realm.layout || {};
    const shifted = (c) => (lay.shift === 'even' ? c % 2 === 0 : c % 2 !== 0);
    const centre = new Map();
    for (const h of realm.hexes) centre.set(h.id, [h.col * 1.5 * S, h.row * 2 * HH + (shifted(h.col) ? HH : 0)]);
    const xs = [...centre.values()].map((p) => p[0]);
    const ys = [...centre.values()].map((p) => p[1]);
    const box = { x: Math.min(...xs) - S - PAD, y: Math.min(...ys) - HH - PAD };
    box.w = Math.max(...xs) + S + PAD - box.x;
    box.h = Math.max(...ys) + HH + PAD - box.y;
    const edgeOf = (a, b) => {
      const ca = centre.get(a);
      const cb = centre.get(b);
      if (!ca || !cb) return null;
      const pa = corners(ca[0], ca[1]);
      const pb = corners(cb[0], cb[1]);
      const same = pa.filter((p) => pb.some((q) => Math.hypot(p[0] - q[0], p[1] - q[1]) < 0.5));
      return same.length === 2 ? same : null;
    };
    // neighbours: the engine's, else the geometry's
    const nbrs = new Map();
    for (const h of realm.hexes) {
      const given = h.neighbours.filter((n) => byId.has(n));
      nbrs.set(h.id, given.length ? given : realm.hexes.filter((o) => o.id !== h.id && edgeOf(h.id, o.id)).map((o) => o.id));
    }
    // days from Morten and the way: breadth first from his hex
    const hops = new Map();
    const way = new Map();
    if (byId.has(origin)) {
      hops.set(origin, 0);
      way.set(origin, [origin]);
      const q = [origin];
      while (q.length) {
        const id = q.shift();
        for (const n of nbrs.get(id) || []) {
          if (hops.has(n)) continue;
          hops.set(n, hops.get(id) + 1);
          way.set(n, [...way.get(id), n]);
          q.push(n);
        }
      }
    }
    const useDays = realm.morten && realm.morten.hex === origin;
    const dayOf = (id) => (useDays && typeof realm.days[id] === 'number' ? realm.days[id] : hops.has(id) ? hops.get(id) : null);
    const hostile = new Set(realm.factions.filter((f) => !f.tower && f.hostile > 0).map((f) => f.name));
    const piecesOf = new Map();
    for (const h of realm.hexes) for (const a of h.assets) {
      if (!piecesOf.has(a.owner)) piecesOf.set(a.owner, []);
      piecesOf.get(a.owner).push({ a, h });
    }
    const evAt = new Map();
    for (const e of realm.eventsWords) for (const id of new Set([e.from, e.to])) {
      if (!id || !byId.has(id)) continue;
      if (!evAt.has(id)) evAt.set(id, []);
      evAt.get(id).push(e);
    }
    const riversAt = new Map();
    for (const [a, b] of realm.rivers) {
      if (!riversAt.has(a)) riversAt.set(a, []);
      if (!riversAt.has(b)) riversAt.set(b, []);
      riversAt.get(a).push(b);
      riversAt.get(b).push(a);
    }
    const tower = realm.factions.find((f) => f.tower) || null;
    const m = { realm, state, origin, byId, facs, centre, box, edgeOf, nbrs, dayOf, way, hostile, piecesOf, evAt, riversAt, tower };
    memo = { realm, origin, state, m };
    return m;
  }

  const nameOf = (m, id) => {
    const given = m.realm.hexNames[id];
    if (given) return given;
    const h = m.byId.get(id);
    return h ? `${poss(h.holder)} ${h.biome || 'land'}${h.lake ? ' with its lake' : ''}` : id;
  };
  const leaderOf = (f) => (f && f.leader && f.leader.name ? `${f.leader.title ? `${f.leader.title} ` : ''}${f.leader.name}` : '');

  // ---------- small parts ----------
  function hexBtn(m, id) {
    const h = m.byId.get(id);
    if (!h) return '';
    const d = m.dayOf(id);
    const seat = h.seat_of && !isTower(h.seat_of) ? icon('crown') : isTower(h.seat_of) ? icon('tower') : '';
    const bits = [h.level !== null ? `level ${h.level}` : '', d === 0 ? 'Morten is here' : d !== null ? days(d) : '', id].filter(Boolean);
    return `<button type="button" class="hexbtn ${fac(h.holder)}" data-hex="${esc(id)}"><span class="sw"></span>${seat}<span class="hn"><span>${esc(cap(nameOf(m, id)))}</span><small>${esc(bits.join(' · '))}</small></span></button>`;
  }

  const pips = (n, max = 3) => `<span class="pips" aria-label="tier ${n}">${Array.from({ length: max }, (_, i) => `<i${i < n ? '' : ' class="off"'}></i>`).join('')}</span>`;

  /** What a piece does, in words, from kinds (else the engine's notation, translated). */
  function pieceWords(a, k) {
    const parts = [];
    if (k) {
      if (k.hits) parts.push(k.hits);
      if (k.counter) parts.push(k.counter);
      if (k.upkeep) parts.push(`upkeep ${fmt.gp(k.upkeep)} a month`);
      if (k.income) parts.push(`+${fmt.gp(k.income)} a month to its owner`);
      for (const s of (k.special || '').split(/;\s*/)) if (s && !/^(income|upkeep)\b/.test(s)) parts.push(s);
    } else {
      parts.push(attackWords(a.attack));
      if (a.counter) parts.push(`hits back ${a.counter}`);
      if (a.special) parts.push(a.special);
    }
    return cap(parts.join('; '));
  }

  /** Strike / Rob, per realms.md's missions; nothing for the tower's own pieces. */
  function missions(m, a, k) {
    if (isTower(a.owner)) return '';
    const tier = a.tier || (k && k.tier) || 1;
    const fight = (k && k.fight) || `${DIFF[Math.min(3, Math.max(1, tier)) - 1]} fight`;
    const out = [`<span>Strike: a ${esc(fight)}, 2d6 to it</span>`];
    if (typeOf(a, k) === 'W') {
      const f = m.facs.get(a.owner);
      let gp = tier * 100 * (a.name === 'Treasury' ? 2 : 1);
      if (f && typeof f.treasury === 'number') gp = Math.min(gp, f.treasury);
      out.push(`<span>${gp > 0 ? `Rob: up to ${esc(fmt.gp(gp))}` : 'Rob: their coffers are empty'}</span>`);
    }
    return `<div class="do">${out.join('')}</div>`;
  }

  function pieceRow(m, a, h, opts = {}) {
    const k = m.realm.kinds[a.name] || null;
    const t = typeOf(a, k);
    const tier = a.tier || (k && k.tier) || 1;
    const hostile = m.hostile.has(a.owner);
    const what = k && k.what ? k.what : `${L[t]} piece`;
    const where = opts.where && h ? (() => {
      const d = m.dayOf(h.id);
      return `<small class="at">in ${esc(nameOf(m, h.id))} · ${esc(d === 0 ? 'where Morten is' : d !== null ? `${days(d)} from Morten` : h.id)}</small>`;
    })() : '';
    return `<div class="piece ${fac(a.owner)}${hostile ? ' hostile' : ''}" data-piece="${esc(a.id)}">`
      + `<span class="tok-big ${band(a.hp, a.max_hp)}" title="${esc(L[t])}">${icon(ATTR[t][0])}</span>`
      + '<div class="body">'
      + `<div class="pn"><b>${esc(a.name || 'A piece')}</b>${opts.owner === false ? '' : `<span>${esc(poss(a.owner))}</span>`}<small>tier ${esc(tier)} · ${esc(what)}</small>${hostile ? `<span class="hos">${icon('skull')}hostile</span>` : ''}</div>`
      + `<div class="hp">${icon('heart')}${bar(a.hp, a.max_hp)}<span>${esc(fmt.hp(a.hp, a.max_hp))}</span>${pips(tier)}</div>`
      + `<p class="what">${esc(pieceWords(a, k))}</p>`
      + where
      + (opts.missions === false ? '' : missions(m, a, k))
      + '</div></div>';
  }

  // ---------- the tower card ----------
  function nextChips(lines) {
    return lines.map((s) => {
      const mm = /^\s*(threat|chance|open)\s*:\s*(.*)$/i.exec(s);
      return mm ? T.ui.chip(mm[2], { kind: mm[1].toLowerCase() }) : T.ui.chip(s);
    }).join('');
  }

  function realmLink(f) {
    const st = f.hostile > 0 ? ` <small>${esc(plural(f.hostile, 'month'))} left</small>` : '';
    return `<button type="button" class="rlink ${fac(f.name)}" data-goto-realm="${esc(f.name)}"><span class="sw"></span>${esc(f.name)}${st}</button>`;
  }

  function towerCard(m) {
    const t = m.tower;
    const r = m.realm;
    if (!t) return '';
    const allies = r.factions.filter((f) => !f.tower && f.ally);
    const hostile = r.factions.filter((f) => !f.tower && f.hostile > 0);
    const own = (m.piecesOf.get(t.name) || []).concat(t.name !== 'tower' ? (m.piecesOf.get('tower') || []) : []);
    const attrs = ['force', 'cunning', 'wealth'].map((k, i) => {
      const c = 'FCW'[i];
      return `<span title="${esc(r.words[k] || '')}">${icon(ATTR[c][0])}${ATTR[c][1]} <b>${esc(fmt.n(t[k]))}</b></span>`;
    }).join('<span class="dot" aria-hidden="true">·</span>');
    const gold = `<p class="gold"><b>${esc(fmt.gp(t.treasury) || '? GP')}</b> in the coffers, <b>${esc(t.income !== null ? `${fmt.signed(t.income)} GP` : '? GP')}</b> a month</p>`;
    const next = r.report.next.length
      ? `<div class="nextm"><span class="label">What month ${esc(r.month !== null ? r.month : (r.report.month || 0) + 1)} can bring</span><div class="chips">${nextChips(r.report.next)}</div></div>`
      : '';
    return '<div class="card tower">'
      + `<h3>${icon('tower')}The tower<small>yours</small></h3>`
      + `<div class="hpbig">${icon('heart')}${bar(t.hp, t.max_hp)}<b>Regime ${esc(fmt.n(t.hp))}/${esc(fmt.n(t.max_hp))}</b></div>`
      + note('realm-regime', '<b>Regime</b> is the tower\'s health as a power. At 0 it is sacked: whoever brought it down carries off half its gold, and the wards still hold the hex.')
      + `<div class="attrs">${attrs}</div>`
      + gold
      + (own.length ? `<div class="sub"><span class="label">Its pieces · ${esc(own.length)}</span><div class="pieces">${own.map(({ a, h }) => pieceRow(m, a, h, { owner: false, missions: false, where: true })).join('')}</div></div>` : '<p class="muted small">No pieces yet: soldiers, spies or income the tower puts on the map.</p>')
      + (t.hexes.length ? `<div class="sub"><span class="label">Its land</span><div class="hexbtns">${t.hexes.map((id) => hexBtn(m, id)).join('')}</div></div>` : '')
      + `<div class="rel"><span class="label">Allies</span><span class="links">${allies.length ? allies.map(realmLink).join('') : '<span class="muted">none</span>'}</span>`
      + `<span class="label">Hostile</span><span class="links">${hostile.length ? hostile.map(realmLink).join('') : '<span class="muted">nobody</span>'}</span></div>`
      + next
      + '</div>';
  }

  // ---------- the map ----------
  const LAND = {
    mountains: 'M-10 6l6-10 4 6 3-4 7 8',
    hills: 'M-10 5q5-8 10-2q4-5 10 2',
    forest: 'M0 7v-4M0 3a5 5 0 1 1 .1 0M-4.6-.5h9.2',
    taiga: 'M0-8l4 5h-2l3 4h-2l3 4h-12l3-4h-2l3-4h-2zM0 5v3',
    tundra: 'M0-7v14M-6-3.5l12 7M-6 3.5l12-7M-2-6l2 2 2-2M-2 6l2-2 2 2',
    plains: 'M-8 6l-1-6M-8 6l2-5M0 6v-8M0 6l-3-5M0 6l3-5M8 6l1-6M8 6l-2-5',
    savanna: 'M-9 6h18M0 6v-6M0 0l-6-3M0 0l6-3M-7-3.5h14',
    swamp: 'M-9 4q3-4 6 0t6 0t6 0M-4 3v-7M0 2v-8M4 3v-6M0-6l-1.5 2',
    desert: 'M-10 6q5-7 10-2q4-5 10 2M4-6a2.5 2.5 0 1 0 .1 0',
    jungle: 'M0 7q1-6 0-11M0-4q-5-3-9 0M0-4q5-3 9 0M0-4q-3-4-7-6M0-4q3-4 7-6',
  };
  const landGlyph = (b) => LAND[b] || 'M-1 0a1 1 0 1 0 2 0a1 1 0 1 0-2 0';

  function tokens(m, h, x, y) {
    const list = h.assets;
    if (!list.length) return '';
    const more = list.length > 6 ? list.length - 5 : 0;
    const shown = more ? list.slice(0, 5) : list;
    const n = shown.length + (more ? 1 : 0);
    const two = n > 3;
    const r = two ? 6.6 : 8.2;
    const ringR = r + 2.2;
    const step = 2 * ringR + 2.4;
    let out = '';
    const place = (i) => {
      const inRow = !two ? n : i < 3 ? 3 : n - 3;
      const k = !two || i < 3 ? i : i - 3;
      const cy = !two ? y + 16 : y + (i < 3 ? 8 : 31);
      return [x - ((inRow - 1) * step) / 2 + k * step, cy];
    };
    shown.forEach((a, i) => {
      const [cx, cy] = place(i);
      const k = m.realm.kinds[a.name] || null;
      const t = typeOf(a, k);
      const tier = Math.max(1, Math.min(3, a.tier || (k && k.tier) || 1));
      const ok = typeof a.hp === 'number' && typeof a.max_hp === 'number' && a.max_hp > 0;
      const rt = ok ? Math.max(0, Math.min(1, a.hp / a.max_hp)) : 1;
      const circ = 2 * Math.PI * ringR;
      const g = r * 1.3;
      const hostile = m.hostile.has(a.owner);
      out += `<g class="tokn ${fac(a.owner)}${hostile ? ' hos' : ''}" data-piece="${esc(a.id)}">`
        + `<circle class="ring" cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(ringR)}"/>`
        + `<circle class="ring on ${band(a.hp, a.max_hp)}" cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(ringR)}" stroke-dasharray="${f1(circ * rt)} ${f1(circ)}" transform="rotate(-90 ${f1(cx)} ${f1(cy)})"/>`
        + `<circle class="tok" cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}"/>`
        + `<use class="tok-g" href="#i-${ATTR[t][0]}" x="${f1(cx - g / 2)}" y="${f1(cy - g / 2)}" width="${f1(g)}" height="${f1(g)}"/>`
        + (hostile ? `<circle class="hostile" cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(ringR + 2.2)}"/><circle class="skull-b" cx="${f1(cx + r * 0.95)}" cy="${f1(cy - r * 0.95)}" r="4.6"/><use class="skull-g" href="#i-skull" x="${f1(cx + r * 0.95 - 3.6)}" y="${f1(cy - r * 0.95 - 3.6)}" width="7.2" height="7.2"/>` : '');
      for (let p = 0; p < tier; p++) out += `<circle class="pip" cx="${f1(cx - (tier - 1) * 1.8 + p * 3.6)}" cy="${f1(cy + ringR + 2.9)}" r="1.25"/>`;
      out += '</g>';
    });
    if (more) {
      const [cx, cy] = place(5);
      out += `<g class="tokn more"><circle class="tok" cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}"/><text class="more-t" x="${f1(cx)}" y="${f1(cy + 3)}" text-anchor="middle">+${more}</text></g>`;
    }
    return out;
  }

  const crownAt = (owner, x, y) => `<g class="${fac(owner)}" transform="translate(${f1(x)} ${f1(y)})"><path class="crown" d="M-7 5h14M-7 5l-1-9 4.5 3.5L0-6l3.5 5.5L8-4l-1 9z"/></g>`;
  const towerAt = (x, y) => `<g class="fac-tower" transform="translate(${f1(x)} ${f1(y)})"><path class="tower-g" d="M-6 7V-4h2.4v-3h2.2v3h2.8v-3h2.2v3H6V7zM-1.6 7V3h3.2v4"/></g>`;

  function arrows(m) {
    let out = '';
    const self = new Map();
    for (const e of m.realm.eventsWords) {
      if (e.n === null) continue;
      const a = m.centre.get(e.from);
      const b = m.centre.get(e.to);
      const cls = fac(e.who);
      const on = evShown === e.n ? ' on' : '';
      if (a && b && e.from !== e.to) {
        const [x1, y1] = a;
        const [x2, y2] = b;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len;
        const uy = dy / len;
        const sx = x1 + ux * 18;
        const sy = y1 + uy * 18;
        const ex = x2 - ux * 30;
        const ey = y2 - uy * 30;
        const bend = 0.22 * len * (e.n % 2 ? 1 : -1);
        const cx = (sx + ex) / 2 - uy * bend;
        const cy = (sy + ey) / 2 + ux * bend;
        const tx = ex - cx;
        const ty = ey - cy;
        const tl = Math.hypot(tx, ty) || 1;
        const hx = tx / tl;
        const hy = ty / tl;
        const head = `${f1(ex + hx * 6)},${f1(ey + hy * 6)} ${f1(ex - hx * 6 - hy * 6)},${f1(ey - hy * 6 + hx * 6)} ${f1(ex - hx * 6 + hy * 6)},${f1(ey - hy * 6 - hx * 6)}`;
        const mx = 0.25 * sx + 0.5 * cx + 0.25 * ex;
        const my = 0.25 * sy + 0.5 * cy + 0.25 * ey;
        const d = `M${f1(sx)} ${f1(sy)}Q${f1(cx)} ${f1(cy)} ${f1(ex)} ${f1(ey)}`;
        out += `<g class="mv ${cls}${on}"><path class="arrow-halo" d="${d}"/><path class="arrow" d="${d}"/><polygon class="head-a" points="${head}"/>${badge(e, mx, my)}</g>`;
      } else {
        const id = a ? e.from : b ? e.to : null;
        if (!id) continue;
        const k = self.get(id) || 0;
        self.set(id, k + 1);
        const [x, y] = m.centre.get(id);
        out += `<g class="mv ${cls}${on}">${badge(e, x - 41, y - 13 + k * 19)}</g>`;
      }
    }
    return out;
  }
  const badge = (e, x, y) => `<circle class="badge" cx="${f1(x)}" cy="${f1(y)}" r="8.5"/><text class="badge-t" x="${f1(x)}" y="${f1(y + 3.5)}" text-anchor="middle">${esc(e.n)}</text>`
    + `<circle class="evhit" data-ev="${esc(e.n)}" cx="${f1(x)}" cy="${f1(y)}" r="15" role="button" tabindex="0" aria-label="Move ${esc(e.n)}: ${esc(e.text)}"/>`;

  function mapSvg(m) {
    const land = [];
    const marks = [];
    const hits = [];
    const borders = [];
    const rivers = [];
    for (const h of m.realm.hexes) {
      const [x, y] = m.centre.get(h.id);
      land.push(`<polygon class="land ${fac(h.holder)}" points="${pts(x, y)}"/>`);
      if (h.lake) marks.push(`<ellipse class="lake" cx="${f1(x - 1)}" cy="${f1(y - 39)}" rx="9" ry="4.5"/>`);
      marks.push(`<text class="hid" x="${f1(x + S - 15)}" y="${f1(y + 4)}" text-anchor="middle">${esc(h.id)}</text>`);
      if (h.level !== null) marks.push(`<text class="lvl" x="${f1(x)}" y="${f1(y - 5)}" text-anchor="middle">${esc(h.level)}</text>`);
      marks.push(`<path class="glyph" transform="translate(${f1(x + 25)} ${f1(y - 13)})" d="${landGlyph(h.biome)}"/>`);
      if (h.seat_of) marks.push(isTower(h.seat_of) ? towerAt(x - 24, y - 35) : crownAt(h.seat_of, x - 24, y - 34));
      marks.push(tokens(m, h, x, y));
      const d = m.dayOf(h.id);
      const label = `${cap(nameOf(m, h.id))}, level ${h.level}${d === 0 ? ', Morten is here' : d !== null ? `, ${days(d)} from Morten` : ''} (${h.id})`;
      hits.push(`<polygon class="hit" data-hex="${esc(h.id)}" points="${pts(x, y)}" tabindex="0" role="button" aria-label="${esc(label)}"/>`);
    }
    const seen = new Set();
    for (const h of m.realm.hexes) for (const nid of m.nbrs.get(h.id) || []) {
      const key = [h.id, nid].sort().join('|');
      if (seen.has(key)) continue;
      seen.add(key);
      const n = m.byId.get(nid);
      if (!n || (h.holder || '') === (n.holder || '')) continue;
      const e = m.edgeOf(h.id, nid);
      if (e) borders.push(`M${f1(e[0][0])} ${f1(e[0][1])}L${f1(e[1][0])} ${f1(e[1][1])}`);
    }
    for (const [a, b] of m.realm.rivers) {
      const e = m.edgeOf(a, b);
      if (e) rivers.push(`M${f1(e[0][0])} ${f1(e[0][1])}L${f1(e[1][0])} ${f1(e[1][1])}`);
    }
    let mort = '';
    const mc = m.centre.get(m.origin);
    if (mc) {
      const [mx, my] = mc;
      mort = `<polygon class="morten-ring" points="${pts(mx, my, S - 6)}"/><g class="morten" transform="translate(${f1(mx + 22)} ${f1(my - 35)})"><circle class="morten-pin" r="9.5"/><path class="morten-g" d="M0-6l3.6 7.5H-3.6zM-4.5 3h9l.8 2.2h-10.6z"/></g>`;
    }
    const pc = m.centre.get(picked);
    const pick = pc ? `<polygon class="picked" points="${pts(pc[0], pc[1], S - 2)}"/>` : '';
    const b = m.box;
    return `<svg class="map${codes ? '' : ' nocodes'}" viewBox="${f1(b.x)} ${f1(b.y)} ${f1(b.w)} ${f1(b.h)}" role="group" aria-label="The realms' map: tap a hex for its entry">`
      + `<g>${land.join('')}</g><path class="border" d="${borders.join('')}"/><path class="river" d="${rivers.join('')}"/>`
      + `<g pointer-events="none">${marks.join('')}</g><g pointer-events="none">${mort}</g><g pointer-events="none">${pick}</g>`
      + `<g>${hits.join('')}</g>`
      + (moves ? `<g class="moves">${arrows(m)}</g>` : '')
      + '</svg>';
  }

  function keyOver() {
    const tok = (g, c = 'fac-humans') => `<span class="ktok ${c}">${icon(g)}</span>`;
    return `<div class="keyover" role="dialog" aria-label="The map's key"><ul>`
      + `<li><b class="klvl">18</b><span>The big number is a hex's <b>level</b>: the floor under it, how bad its wanderers are, and its income (level × 10 GP a month).</span></li>`
      + `<li>${tok('sword')}<span>Soldiers (Force): they take land and break pieces.</span></li>`
      + `<li>${tok('mask')}<span>Spies (Cunning): they see, sabotage and chip at a regime.</span></li>`
      + `<li>${tok('coins')}<span>Income (Wealth): farms, caravans, mines, a treasury.</span></li>`
      + `<li><span class="kpips">${pips(2)}</span><span>The pips under a token: its tier, 1 to 3. The ring round it: its health.</span></li>`
      + `<li><span class="kic bad">${icon('skull')}</span><span>A red ring and a skull: the owner is hostile to the tower.</span></li>`
      + `<li><span class="kic">${icon('crown')}</span><span>A ruler's seat, in the realm's colour.</span></li>`
      + `<li><span class="kic">${icon('tower')}</span><span>The tower: your seat.</span></li>`
      + `<li><span class="kic">${icon('pin')}</span><span>Morten, and the dashed brass ring round his hex.</span></li>`
      + `<li><span class="kn">3</span><span>Last month's moves, numbered as in the story's world's turn; tap a number for its sentence.</span></li>`
      + `<li><span class="kriv"></span><span>A river: a defender is +1 against attacks over it. The lines between colours are borders.</span></li>`
      + `</ul><button type="button" class="toggle" data-t="key" aria-pressed="true">Close the key</button></div>`;
  }

  function mapBar() {
    const t = (k, label, on) => `<button type="button" class="toggle" data-t="${k}" aria-pressed="${on}">${label}</button>`;
    return t('codes', 'Codes', codes) + t('moves', 'Moves', moves) + t('key', `${icon('q')}<span class="vh">The key</span>`, keyOn)
      + '<span class="hint">Tap a hex for its entry</span>';
  }

  function evLine(m) {
    if (evShown === null) return '';
    const e = m.realm.eventsWords.find((x) => x.n === evShown);
    if (!e) return '';
    return `<ol class="events evline"><li class="${fac(e.who)}"><span class="n">${esc(e.n)}</span><span>${esc(e.text)}</span><button type="button" class="x" data-ev-close aria-label="Close">×</button></li></ol>`;
  }

  // ---------- the hex entry ----------
  function roomsStrip(m, h) {
    const fl = m.realm.floors[h.id];
    const n = fl && fl.floor !== null ? fl.floor : h.level;
    const st = m.state;
    const nowRoom = st && st.hex === h.id ? (/room\s+(\d+\.\d+)/i.exec(st.where || '') || [])[1] : null;
    const rooms = fl ? fl.rooms : [];
    const cells = rooms.map((r) => {
      const known = r.state !== 'unknown' && r.monster;
      const done = r.state === 'cleared';
      const now = r.n === nowRoom || r.state === 'fighting';
      const cls = ['room', done ? 'done' : '', now ? 'now' : ''].filter(Boolean).join(' ');
      const sub = known ? `${r.monster}${r.cr ? ` (CR ${r.cr})` : ''}` : '?';
      const tip = [known ? sub : 'not yet explored', r.state !== 'unknown' ? r.state : '', r.note].filter(Boolean).join(' · ');
      return `<span class="${cls}" title="${esc(tip)}"><b>${esc(r.n)}${done ? ' <i class="ok" aria-label="cleared">✓</i>' : ''}</b><small>${esc(sub)}</small>${r.note ? `<small class="nt">${esc(r.note)}</small>` : ''}</span>`;
    });
    if (!rooms.length) cells.push(`<span class="room"><b>?</b><small>not entered</small></span>`);
    else if (!(fl && fl.cleared) && !rooms.some((r) => r.state === 'unknown')) cells.push('<span class="room"><b>?</b><small>more?</small></span>');
    const head = `The floor under it · floor ${n !== null ? esc(n) : '?'}${fl && fl.cleared ? ' · cleared' : ''}`;
    return `<span class="label">${head}</span><div class="rooms">${cells.join('')}</div>`;
  }

  function entry(m, id) {
    const h = m.byId.get(id);
    if (!h) return '';
    const r = m.realm;
    const home = isTower(h.holder);
    const lv = h.level;
    const d = m.dayOf(id);
    const holder = m.facs.get(h.holder);
    const held = home
      ? 'Yours, warded: it can never be seized'
      : h.holder ? `Held by ${esc(the(h.holder))}${h.people === h.holder ? ', their own people' : h.people ? `, ${esc(poss(h.people))} land` : ''}` : 'Held by nobody';
    const occupiers = h.assets.filter((a) => a.owner !== h.holder && typeOf(a, r.kinds[a.name]) === 'F').map((a) => a.owner);
    const inc = typeof h.income === 'number' ? h.income : lv !== null ? lv * 10 : null;
    const income = inc === 0 && occupiers.length
      ? `pays ${home ? 'the tower' : 'them'} nothing while ${esc(the(occupiers[0]))}' soldiers stand in it`
      : inc !== null ? `${esc(fmt.gp(inc))} a month to ${home ? 'the tower' : 'them'}` : '';
    const way = m.way.get(id);
    const dist = d === 0 ? '<b class="brass">Morten is here</b>'
      : d !== null ? `<b>${esc(days(d))} from Morten</b>${way && way.length > 1 ? ` <span class="way">(${esc(way.join(' → '))})</span>` : ''}`
        : 'no way there from Morten';
    const riv = m.riversAt.get(id) || [];
    const river = riv.length ? ` · a river edge against ${riv.map((x) => esc(cap(nameOf(m, x)).replace(/^The /, 'the ')) + ` <small class="code">${esc(x)}</small>`).join(', ')}: a defender here is +1 against attacks from there` : '';
    let seat = '';
    if (h.seat_of) seat = isTower(h.seat_of) ? ' The tower stands here.' : ` The seat of ${esc(leaderOf(m.facs.get(h.seat_of)) || 'the ruler')} of ${esc(the(h.seat_of))}.`;

    // missions beyond the pieces: Strike an unguarded seat, Contact, Delve
    const more = [];
    if (h.seat_of && !isTower(h.seat_of) && !h.assets.some((a) => a.owner === h.seat_of && typeOf(a, r.kinds[a.name]) === 'F')) {
      more.push(`<span>Strike the seat: a High fight, 2d6 to ${esc(poss(h.seat_of))} regime</span>`);
    }
    if (!home && holder) {
      const om = m.state && m.state.awaiting && m.state.awaiting.orders ? m.state.awaiting.orders.missions : [];
      const given = om.find((x) => x.type === 'contact' && x.target === id);
      const dc = given && /DC\s*(\d+)/.exec(given.label) ? /DC\s*(\d+)/.exec(given.label)[1]
        : typeof holder.cunning === 'number' ? 10 + holder.cunning - (holder.leader.tag === 'Tyrant' ? 4 : 0) : null;
      more.push(`<span>Contact the people: Persuasion${dc !== null ? ` DC ${esc(dc)}` : ''}</span>`);
    }
    const pieces = h.assets.length
      ? `<div class="pieces">${h.assets.map((a) => pieceRow(m, a, h)).join('')}</div>`
        + (h.assets.some((a) => !isTower(a.owner)) ? '<p class="muted small">A Strike or a Rob is a fight for Morten, and turns the owner hostile to the tower for 3 months (6 at a seat).</p>' : '')
      : '<p class="muted small">Nothing the tower can see stands here.</p>';
    const evs = m.evAt.get(id) || [];
    const heard = r.rumours[id] || [];
    const nb = m.nbrs.get(id) || [];
    return `<h3>${esc(cap(nameOf(m, id)))}${lv !== null ? `, level ${esc(lv)}` : ''}${home ? ' · home' : ''}<span class="code">${esc(id)}</span></h3>`
      + `<p class="line">${[held, income, dist].filter(Boolean).join(' · ')}${river}.</p>`
      + (lv !== null ? `<p class="line lvl-line">Level ${esc(lv)}: floor ${esc(lv)} lies under it, and its wanderers are level-${esc(lv)} trouble.${seat}</p>` : seat ? `<p class="line">${seat.trim()}</p>` : '')
      + `<span class="label">Pieces here · ${esc(h.assets.length)}</span>${pieces}`
      + (more.length ? `<span class="label">Morten's missions here</span><div class="do">${more.join('')}</div>` : '')
      + roomsStrip(m, h)
      + (evs.length ? `<span class="label">Last month here</span><ol class="events">${evs.map((e) => `<li class="${fac(e.who)}"><span class="n">${esc(e.n)}</span><span>${esc(e.text)}</span></li>`).join('')}</ol>` : '')
      + (heard.length ? `<span class="label">Heard here</span><ul class="heard">${heard.map((s) => `<li>${icon('speech')}<span>${esc(noIds(s))}</span></li>`).join('')}</ul>` : '')
      + (nb.length ? `<span class="label">Next to</span><div class="hexbtns">${nb.map((x) => hexBtn(m, x)).join('')}</div>` : '');
  }

  // ---------- the realm rows ----------
  function stateWords(f) {
    const out = [];
    if (f.ally) out.push('<span class="st good">ally</span>');
    if (f.hostile > 0) out.push(`<span class="st bad">${icon('skull')}hostile · ${esc(plural(f.hostile, 'month'))} left</span>`);
    if (f.disorder > 0) out.push(`<span class="st warn">in disorder · ${esc(plural(f.disorder, 'month'))}</span>`);
    if (typeof f.hp === 'number' && f.hp <= 0) out.push('<span class="st bad">fallen</span>');
    return out.join('');
  }

  function realmRow(m, f) {
    const isOpen = open.has(f.name);
    const lab = f.leader.label ? `${f.leader.label}${f.leader.verb ? `: ${f.leader.verb}` : ''}` : f.leader.verb;
    const glyphs = ['force', 'cunning', 'wealth'].map((k, i) => `<span title="${ATTR['FCW'[i]][1]}">${icon(ATTR['FCW'[i]][0])}<span class="vh">${ATTR['FCW'[i]][1]} </span>${esc(fmt.n(f[k]))}</span>`).join('');
    const pcs = m.piecesOf.get(f.name) || [];
    const body = isOpen ? `<div class="more">`
      + `<p class="goal">${icon('flag')}<span>${f.goal ? `Going to ${esc(noIds(f.goal))}.` : 'No goal yet.'}</span></p>`
      + `<p class="gold"><b>${esc(fmt.gp(f.treasury) || '? GP')}</b> in the coffers, <b>${esc(f.income !== null ? `${fmt.signed(f.income)} GP` : '? GP')}</b> a month</p>`
      + (f.hexes.length ? `<span class="label">Its land · ${esc(plural(f.hexes.length, 'hex', 'hexes'))}</span><div class="hexbtns">${[...f.hexes].sort((a, b) => (b === f.seat) - (a === f.seat)).map((id) => hexBtn(m, id)).join('')}</div>` : '<p class="muted small">It holds no land.</p>')
      + `<span class="label">Pieces the tower can see · ${esc(pcs.length)}</span>`
      + (pcs.length ? `<div class="pieces">${pcs.map(({ a, h }) => pieceRow(m, a, h, { owner: false, where: true })).join('')}</div>` : '<p class="muted small">None seen.</p>')
      + '</div>' : '';
    return `<div class="rrow ${fac(f.name)}" data-realm="${esc(f.name)}" data-open="${isOpen}">`
      + `<button type="button" class="rhead" data-realm-toggle="${esc(f.name)}" aria-expanded="${isOpen}">`
      + '<span class="sw"></span>'
      + `<span class="top"><b>${esc(f.name)}</b><span class="sts">${stateWords(f)}</span><span class="lv">${esc(leaderOf(f))}${lab ? ` · <i>${esc(lab)}</i>` : ''}</span></span>`
      + `<span class="nums"><span class="reg">${icon('heart')}${bar(f.hp, f.max_hp)}<span>Regime ${esc(fmt.n(f.hp))}/${esc(fmt.n(f.max_hp))}</span></span>${glyphs}</span>`
      + `${icon('chev', 'chev')}</button>${body}</div>`;
  }

  function realmRows(m) {
    const list = m.realm.factions.filter((f) => !f.tower);
    if (!list.length) return '';
    const rank = (f) => (f.ally ? 0 : f.hostile > 0 ? 1 : 2);
    const sorted = list.map((f, i) => ({ f, i })).sort((a, b) => rank(a.f) - rank(b.f) || a.i - b.i).map((x) => x.f);
    return `<h3>${icon('crown')}The realms<small>allies first, then the hostile</small></h3><div class="rrows">${sorted.map((f) => realmRow(m, f)).join('')}</div>`;
  }

  // ---------- state, painting, events ----------
  let box = null;
  let parts = null;
  let last = null;
  let picked = null;
  let evShown = null;
  let keyOn = false;
  let codes = !!local.get('realm.codes', false);
  let moves = local.get('realm.moves', true) !== false;
  const open = new Set();

  function skeleton() {
    box.innerHTML = '<div data-part="tower"></div><div data-part="note"></div><div class="mapbar" data-part="bar"></div>'
      + '<div class="frame" data-part="frame"><div data-part="svg"></div><div data-part="key"></div></div>'
      + '<div data-part="ev"></div><article class="card entry" data-part="entry" aria-live="polite"></article>'
      + '<div class="card realms" data-part="realms"></div>';
    box.__tableHtml = null;
    parts = {};
    for (const el of box.querySelectorAll('[data-part]')) parts[el.dataset.part] = el;
  }

  function paint() {
    if (!box || !last) return;
    const r = last.realm;
    if (!r || !r.hexes.length) {
      parts = null;
      const msg = !last.loaded || last.loaded.realm || last.db !== 'ok'
        ? (last.db === 'ok' ? 'No map yet: the GM draws it with the campaign\'s first world\'s turn.' : 'No map in this view.')
        : 'Opening the map…';
      put(box, `<div class="card"><h3>${icon('hex')}The realm</h3><p class="muted">${esc(msg)}</p></div>`);
      return;
    }
    if (!parts) skeleton();
    const m = model(r, last.state);
    if (!picked || !m.byId.has(picked)) picked = m.byId.has(m.origin) ? m.origin : r.hexes[0].id;
    put(parts.tower, towerCard(m));
    put(parts.note, note('realm-map', 'Colours are realms. The big number is a hex\'s <b>level</b>: the floor under it, how bad its wanderers are, and its income (level × 10 GP a month). The round tokens are <b>pieces</b> a realm put there: a sword is soldiers, a mask spies, coins income; the ring round a token is its health. A crown is a ruler\'s seat. Tap a hex.'));
    put(parts.bar, mapBar());
    put(parts.svg, mapSvg(m));
    put(parts.key, keyOn ? keyOver() : '');
    put(parts.ev, evLine(m));
    parts.entry.dataset.hex = picked;
    put(parts.entry, entry(m, picked));
    put(parts.realms, realmRows(m));
  }

  function revealEntry() {
    const el = parts && parts.entry;
    if (!el) return;
    const top = el.getBoundingClientRect().top;
    if (top > window.innerHeight - 140 || top < 0) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  function pick(id, reveal) {
    picked = id;
    paint();
    if (reveal) revealEntry();
  }

  function onClick(ev) {
    const t = ev.target;
    if (!t || !t.closest) return;
    const tg = t.closest('[data-t]');
    if (tg) {
      const k = tg.dataset.t;
      if (k === 'codes') { codes = !codes; local.set('realm.codes', codes); }
      if (k === 'moves') { moves = !moves; local.set('realm.moves', moves); if (!moves) evShown = null; }
      if (k === 'key') keyOn = !keyOn;
      paint();
      return;
    }
    const evb = t.closest('[data-ev]');
    if (evb) {
      const n = parseInt(evb.getAttribute('data-ev'), 10);
      evShown = evShown === n ? null : n;
      paint();
      return;
    }
    if (t.closest('[data-ev-close]')) { evShown = null; paint(); return; }
    const hx = t.closest('[data-hex]');
    if (hx) {
      pick(hx.getAttribute('data-hex'), true);
      return;
    }
    const rt = t.closest('[data-realm-toggle]');
    if (rt) {
      const n = rt.getAttribute('data-realm-toggle');
      if (open.has(n)) open.delete(n); else open.add(n);
      paint();
      return;
    }
    const go = t.closest('[data-goto-realm]');
    if (go) {
      const n = go.getAttribute('data-goto-realm');
      open.add(n);
      paint();
      const row = Array.from(box.querySelectorAll('.rrow')).find((x) => x.dataset.realm === n);
      if (row) row.scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
  }

  function onKey(ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const t = ev.target;
    if (!t || !t.matches || !t.matches('.hit[data-hex], .evhit[data-ev]')) return;
    ev.preventDefault();
    onClick(ev);
  }

  T.panels.realm = {
    mount(el) {
      box = el;
      box.addEventListener('click', onClick);
      box.addEventListener('keydown', onKey);
    },
    render(view) {
      last = view;
      paint();
    },
    /** Open the Realm on a hex (for the other panels: an orders hex, a world's-turn event). */
    show(id) {
      if (T.app && T.app.go) T.app.go('realm');
      if (typeof id === 'string' && id) pick(id, true);
    },
  };
})();
/* ---- js/80-more.js ---- */
// The More panels (README: File ownership): Months, Rules, Talk and Table, plus two things
// that decorate the whole page from here without touching the shell:
// - the first-visit notes for every tab (T.notes.for(tab) for a panel to place; Morten,
//   Realm and Fights get theirs before their pane when the panel shows no note of its own),
// - the unread marks: a dot on the Story tab (new sections or beats), on Talk (a new aside)
